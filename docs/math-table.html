const ABOUT = {
  'facts-mul': "Multiplication facts are the times tables \u2014 7 \u00d7 8, 6 \u00d7 9, all of them. The goal is to know them without stopping to work them out, the way you know your own address. Almost everything else in math is built on top of these: long multiplication, division, simplifying fractions, percents. When the facts are slow, all of that feels hard even when you actually understand it. So this is worth the time.",
  'facts-div': "Division facts are the times tables read backwards. If you know 6 \u00d7 7 = 42, then you already know 42 \u00f7 7 = 6 \u2014 it is the exact same fact, just asked from the other end. Getting fast at these is what turns long division from something exhausting into something you can just do.",
  'add': "Adding big numbers means adding one column at a time, starting from the right. Each column only has room for one digit, so when a column adds up past 9 the extra has to move somewhere \u2014 you carry it into the next column left. That is really the whole idea, and it is the same idea behind carrying in every other kind of addition you will meet.",
  'sub': "Subtracting big numbers goes column by column too, but sometimes the digit on top is too small to take from. Then you borrow: you trade one from the column to the left, and it is worth ten over here. Nothing gets created or destroyed \u2014 the number is just rearranged into a shape you can subtract from.",
  'mul': "Multiplying big numbers works by breaking one hard problem into a stack of easy ones. You multiply by each digit separately and then add the pieces up. The reason it works is place value: the 2 in 26 is really 20, and that is exactly why that row gets a zero on the end. Once you see that, the method stops feeling like a random set of rules.",
  'div': "Long division is sharing a big number into equal groups, one place value at a time. You repeat the same four moves \u2014 divide, multiply, subtract, bring down \u2014 until there is nothing left to bring down. Anything left over at the very end is the remainder. It looks like a lot of steps, but it is one short cycle done over and over.",
  'place': "Where a digit sits decides what it is worth. The 4 in 400 is not the same as the 4 in 40. Rounding uses that idea: you decide which nearby round number your number is closest to. This is how people do quick math in their heads, and it is how you check whether an answer you just worked out is even close to sensible.",
  'factors': "Factors are the numbers that divide into something evenly. Multiples are the numbers you land on when you count up by it. These two ideas are the toolkit for fractions: the greatest common factor is what you divide by to simplify a fraction, and the least common multiple is the denominator you need to add two fractions. Learn them here and the fraction work gets much easier.",
  'pemdas': "When a problem has several operations in it, everyone has to do them in the same order or people would get different answers to the same question. The agreed order is: brackets first, then powers, then multiplying and dividing, then adding and subtracting. It is a rule about how to read a problem, not about the numbers themselves.",
  'exponents': "An exponent is a shortcut for multiplying something by itself over and over. The small raised number counts how many times the big number appears \u2014 so 3\u2074 means 3 \u00d7 3 \u00d7 3 \u00d7 3, not 3 \u00d7 4. That mix-up is the most common mistake there is. Powers of ten matter most, because they are what actually moves a decimal point.",
  'frac-equiv': "The same amount can be written as lots of different-looking fractions: 1/2, 2/4 and 5/10 are all exactly the same size. Multiply or divide the top and the bottom by the same number and the value does not change \u2014 you have just cut the whole into more or fewer pieces. Simplifying means writing it with the smallest numbers you can, which makes every other fraction job easier.",
  'frac-mixed': "2 3/4 and 11/4 are the same amount written two different ways. Mixed numbers are easier to picture and to compare \u2014 you can see it is a bit under 3. Improper fractions are easier to calculate with. Being able to flip between them is what lets you multiply and divide fractions without getting stuck.",
  'frac-addsub': "You can only add or subtract fractions when the pieces are the same size. Thirds and quarters are different-sized pieces, so first you cut both into a size they share, and then you count. That is all a common denominator is \u2014 the denominator tells you the piece size, so they have to match before the pieces can be counted together.",
  'frac-muldiv': "Multiplying fractions is the easy one: top times top, bottom times bottom, no matching needed. Dividing is nearly as easy once you know the move \u2014 flip the second fraction over and multiply. The surprising part is that multiplying by less than one makes things smaller, and dividing by less than one makes them bigger. That feels backwards until you see why.",
  'dec-addsub': "Adding and subtracting decimals is exactly like whole numbers with one extra rule: line up the decimal points, not the right-hand edges. That keeps tenths under tenths and hundredths under hundredths, so you are always adding things that mean the same amount. Line up the wrong edge and you are adding dimes to pennies.",
  'dec-muldiv': "To multiply decimals, ignore the points, do the whole-number problem you already know how to do, then count how many decimal places were in the question and put that many in the answer. To divide, slide both points along until the number you are dividing by is whole. Estimating first is what tells you whether your point landed in a sensible place.",
  'percent': "Percent means \"out of a hundred\". 25% is 25 out of every 100, which is the same thing as 0.25, and the same thing as 1/4 \u2014 three ways of writing one amount. Once you can swap between them freely, most percent questions turn into multiplication you can already do. This is also the math behind sale prices, tips and test scores.",
  'ratio': "A ratio compares two amounts \u2014 3 cups of flour to 2 cups of water. Scale both parts by the same number and the mix stays the same, which is why a recipe can be doubled. The most useful move is finding the unit rate: what just one costs or weighs. Once you know that, you can work out any quantity instantly instead of solving a new problem each time.",
  'integers': "Numbers keep going below zero \u2014 temperatures, money you owe, floors below ground level. On a number line the sign tells you which direction to go and the number tells you how far. The tricky one is subtracting a negative, which moves you to the right, because taking away a backwards step is the same as taking a forwards step.",
  'equations': "An equation is a balance scale: both sides weigh the same. Solving for x means getting x by itself on one side, and there is really only one rule \u2014 whatever you do to one side you have to do to the other, or it tips. The best part is that you can always check yourself by putting your answer back into the original and seeing if it balances.",
  'geometry': "Perimeter is the distance all the way around the outside \u2014 the fence. Area is how much surface is inside \u2014 the grass. Volume is how much space something holds. Every formula here is just a shortcut for counting: area counts squares, volume counts cubes. That is also why area is measured in square units and volume in cubic ones."
};

const BY_ID = {}; TOPICS.forEach(t=>BY_ID[t.id]=t);
const GROUPS = [];
TOPICS.forEach(t=>{ if(GROUPS.indexOf(t.group)<0) GROUPS.push(t.group); });

const S = {
  topicId:'facts-mul', mode:'learn', level:1,
  prob:null, M:null, watchIdx:0, try:null,
  levelMemo:{},
  practice:{prob:null, right:0, total:0, streak:0, best:0, answered:false},
  tryStats:{solved:0, clean:0},
  ui:{areaShown:{}, shareStep:0},
  facts:null,
  timer:null
};
function topic(){ return BY_ID[S.topicId]; }
function modesFor(t){
  if(t.engine==='facts') return [['learn','Learn'],['drill','Drill']];
  const m=[];
  if(hasPicture()) m.push(['picture','Picture it']);
  m.push(['watch','Watch it'],['try','You try'],['practice','Practice']);
  return m;
}
function hasPicture(){
  try{ return !!(S.M && S.M.picture && S.M.picture(S.ui)); }catch(e){ return false; }
}
function sameAns(a,b){
  const sa=String(a).trim(), sb=String(b).trim();
  if(sa===''||sb==='') return false;
  const na=Number(sa.replace(/[,\s$]/g,'')), nb=Number(sb.replace(/[,\s$]/g,''));
  if(!isNaN(na)&&!isNaN(nb)) return rd(na,6)===rd(nb,6);
  return sa.toLowerCase()===sb.toLowerCase();
}

/* ---------------- problem lifecycle ---------------- */
function newProblem(){
  const t=topic();
  if(t.engine==='facts'){ initFacts(); return; }
  S.prob = t.gen(S.level);
  S.M = t.build(S.prob);
  S.watchIdx = 0; S.try = null;
  S.ui = {areaShown:{}, shareStep:0};
}
function newPractice(){
  const t=topic();
  if(t.engine==='facts') return;
  S.practice.prob = t.gen(S.level);
  S.practice.answered = false;
}
function setProblem(prob){
  const t=topic();
  S.prob = prob; S.M = t.build(prob);
  S.watchIdx = 0; S.try = null; S.ui = {areaShown:{}, shareStep:0};
}

/* =======================================================================
   YOU TRY
   ======================================================================= */
function initTry(){
  const t=topic();
  if(t.engine==='grid'){
    S.M.slots.forEach(s=>{ s.val=''; s.state=''; });
    S.try={kind:'grid', slots:S.M.slots, mistakes:0, hint:'', shown:false, scratch:{}};
  } else {
    const slots=[];
    S.M.steps.forEach((st,si)=> (st.ask||[]).forEach(a=>{
      slots.push({idx:slots.length, expect:String(a.expect), label:a.label, w:a.w||4,
                  mode:a.mode||'numeric', val:'', state:'', step:si});
    }));
    S.try={kind:'steps', slots:slots, mistakes:0, hint:'', shown:false, scratch:{}};
  }
}
function nextSlot(){
  const T=S.try;
  for(let i=0;i<T.slots.length;i++) if(T.slots[i].state!=='ok' && T.slots[i].state!=='given') return i;
  return -1;
}
function trySolved(){ return nextSlot()===-1 && S.try.slots.length>0; }

function handleGridInput(el){
  const T=S.try, i=Number(el.getAttribute('data-s')), s=T.slots[i];
  const v=el.value.replace(/[^0-9]/g,'').slice(-1);
  s.val=v;
  if(v===''){ s.state=''; T.hint=''; return rerender(i); }
  if(v===s.expect){ s.state='ok'; T.hint=''; }
  else { s.state='bad'; T.mistakes++; T.hint='Not quite — '+(s.hint||'have another look at that column.'); }
  rerender(s.state==='ok'?nextSlot():i);
}
function handleStepInput(el, force){
  const T=S.try, i=Number(el.getAttribute('data-s')), s=T.slots[i];
  s.val = el.value;
  const v=el.value.trim();
  if(v===''){ s.state=''; T.hint=''; return force?rerender(i):null; }
  if(sameAns(v, s.expect)){ s.state='ok'; T.hint=''; return rerender(nextSlot()); }
  if(force || v.replace('-','').length >= s.expect.replace('-','').length){
    s.state='bad'; T.mistakes++; T.hint='Not quite. Read the hint under the step and try again.';
    return rerender(i);
  }
  s.state=''; T.hint='';
  if(el.className.indexOf('bad')>=0) rerender(i);
}
function rerender(focusIdx){
  render();
  requestAnimationFrame(()=>{
    if(focusIdx>=0){
      const el=stage().querySelector('[data-s="'+focusIdx+'"]');
      if(el){ el.focus(); if(el.select) el.select(); }
    }
  });
}
function showThisStep(){
  const T=S.try;
  if(T.kind==='grid'){
    const i=nextSlot(); if(i<0) return;
    T.slots[i].val=T.slots[i].expect; T.slots[i].state='given';
    T.hint=''; return rerender(nextSlot());
  }
  const cur=currentStepIdx();
  T.slots.filter(s=>s.step===cur).forEach(s=>{ s.val=s.expect; s.state='given'; });
  T.hint=''; T.shown=true; rerender(nextSlot());
}
function currentStepIdx(){
  const M=S.M, T=S.try;
  for(let i=0;i<M.steps.length;i++){
    const ss=T.slots.filter(s=>s.step===i);
    if(ss.length && !ss.every(s=>s.state==='ok'||s.state==='given')) return i;
  }
  return M.steps.length;
}

function renderTry(){
  const t=topic(), M=S.M, T=S.try;
  const solved=trySolved();
  const stats = S.tryStats.solved>0
    ? '<span class="pill">Solved <b>'+S.tryStats.solved+'</b></span>'+
      (S.tryStats.clean>0?'<span class="pill streak">Clean runs <b>'+S.tryStats.clean+'</b></span>':'')
    : '';
  let work='', helper='';

  if(T.kind==='grid'){
    work = M.renderTry(T);
    const i=nextSlot();
    helper = solved ? '' :
      '<div class="narr"><div class="lbl">Next box</div><p>'+(i>=0?(T.slots[i].hint||'Fill in the highlighted box.'):'')+'</p>'+
      (T.hint?'<p style="color:var(--berry)">'+T.hint+'</p>':'')+'</div>';
    if(M.tryNote) helper += '<div class="note">'+M.tryNote+'</div>';
  } else {
    const cur=currentStepIdx();
    work = (M.lead?'<div style="margin-bottom:14px">'+M.lead+'</div>':'');
    work += '<div class="steps">';
    M.steps.forEach((st,i)=>{
      // Steps past the current one stay hidden: several labels name a value the
      // current step is asking for ("Rewrite both fractions over 20"), so showing
      // them ahead of time hands over the answer.
      if(i>cur) return;
      const mine=T.slots.filter(s=>s.step===i);
      const given=mine.length&&mine.every(s=>s.state==='given');
      const cls = i<cur ? (given?'given':'done') : 'now';
      work += '<div class="stp '+cls+'"><div class="stpnum">'+(i<cur?(given?'!':'✓'):(i+1))+'</div><div class="stpbody">'+
              '<div class="stplbl">'+st.lbl+'</div>';
      if(i<cur){ work += (st.show||''); }
      else {
        if(mine.length) work += '<div class="stpwork">'+mine.map(s=>stepInput(s)).join('')+'</div>';
        else work += (st.show||'');
        if(T.shown||T.hint||mine.some(s=>s.state==='bad')) work += '<div class="stpsay">'+st.say+(st.sub?' '+st.sub:'')+'</div>';
        if(T.hint) work += '<div class="stphint">'+T.hint+'</div>';
      }
      work += '</div></div>';
    });
    const left=M.steps.length-cur-1;
    if(left>0) work += '<div class="stp todo"><div class="stpnum">·</div><div class="stpbody">'+
      '<div class="stplbl">'+left+' more step'+(left===1?'':'s')+' after this one</div></div></div>';
    work += '</div>';
  }

  return '<div class="card">'+
    '<div class="cardhead"><div><h2>'+M.title+'</h2>'+
    '<p class="sub">Fill in one step at a time. Boxes turn green the moment they are right.</p></div>'+
    '<div class="btnrow">'+
      (solved?'':'<button class="btn sm" id="tStep">Show me this step</button>')+
      '<button class="btn ghost sm" id="tClear">Start over</button>'+
      '<button class="btn sm" id="tAnother">Try another</button>'+
    '</div></div>'+
    work + helper +
    (solved
      ? '<div class="banner"><span class="bmsg">'+
          (T.mistakes===0 && !T.slots.some(s=>s.state==='given') ? 'Clean run — no misses. ' : '')+
          'Answer: '+M.answerText+'</span>'+
          '<button class="btn sage" id="tAnother2">Try another →</button></div>'
      : '')+
    (stats?'<div class="scorebar">'+stats+'</div>':'')+
    '</div>';
}
function tryAnother(){
  if(trySolved()){
    S.tryStats.solved++;
    if(S.try.mistakes===0 && !S.try.slots.some(s=>s.state==='given')) S.tryStats.clean++;
  }
  newProblem(); initTry(); rerender(0);
}

/* =======================================================================
   WATCH IT
   ======================================================================= */
function renderWatch(){
  const t=topic(), M=S.M;
  if(t.engine==='grid'){
    const ph=M.phases;
    if(S.watchIdx>ph.length-1) S.watchIdx=ph.length-1;
    const idx=S.watchIdx, nar=M.narrate(idx), isDone=ph[idx].t==='done';
    const pct=Math.round(((idx+1)/ph.length)*100);
    return '<div class="card">'+
      head(M.title, 'Step '+(idx+1)+' of '+ph.length+' — read each step out loud together before pressing next.', watchBtns(idx, ph.length))+
      (M.strip?M.strip(idx):'')+
      M.render(idx,{animate:true})+
      narrBox(nar, isDone)+
      '<div class="progress"><i style="width:'+pct+'%"></i></div></div>';
  }
  const n=M.steps.length;
  if(S.watchIdx>n-1) S.watchIdx=n-1;
  const idx=S.watchIdx, st=M.steps[idx], isDone=idx===n-1;
  let work=(M.lead?'<div style="margin-bottom:14px">'+M.lead+'</div>':'')+'<div class="steps">';
  M.steps.forEach((s,i)=>{
    if(i>idx) return;
    work += '<div class="stp '+(i===idx?'now':'done')+'"><div class="stpnum">'+(i<idx?'✓':(i+1))+'</div>'+
            '<div class="stpbody"><div class="stplbl">'+s.lbl+'</div>'+(s.show||'')+'</div></div>';
  });
  work += '</div>';
  const pct=Math.round(((idx+1)/n)*100);
  return '<div class="card">'+
    head(M.title, 'Step '+(idx+1)+' of '+n+' — read each step out loud together before pressing next.', watchBtns(idx,n))+
    work +
    narrBox({lbl:st.lbl, main:st.say, sub:st.sub||''}, isDone)+
    (isDone?'<div class="banner"><span class="bmsg">Answer: '+M.answerText+'</span></div>':'')+
    '<div class="progress"><i style="width:'+pct+'%"></i></div></div>';
}
function head(title, sub, btns){
  return '<div class="cardhead"><div><h2>'+title+'</h2><p class="sub">'+sub+'</p></div>'+
    (btns?'<div class="btnrow">'+btns+'</div>':'')+'</div>';
}
function watchBtns(idx,total){
  return '<button class="btn sm" id="wBack"'+(idx===0?' disabled':'')+'>Back</button>'+
         '<button class="btn primary sm" id="wNext"'+(idx>=total-1?' disabled':'')+'>Next step</button>'+
         '<button class="btn ghost sm" id="wAll">Show all</button>'+
         '<button class="btn ghost sm" id="wReset">Restart</button>';
}
function narrBox(nar, done){
  return '<div class="narr'+(done?' done':'')+'"><div class="lbl">'+(nar.lbl||'')+'</div>'+
    '<p>'+(nar.main||'')+'</p>'+(nar.sub?'<p>'+nar.sub+'</p>':'')+'</div>';
}

/* =======================================================================
   PICTURE IT
   ======================================================================= */
function renderPicture(){
  const pic = S.M.picture ? S.M.picture(S.ui) : null;
  if(!pic) return '<div class="card"><p class="sub">No visual model for this one — try Watch it.</p></div>';
  return '<div class="card">'+head(pic.head.title, pic.head.sub, pic.head.btns)+pic.body+'</div>';
}

/* =======================================================================
   PRACTICE
   ======================================================================= */
function practiceFields(t,p){
  const f=t.practice.fields;
  return typeof f==='function' ? f(p) : f;
}
function renderPractice(){
  const t=topic(), P=S.practice;
  if(!P.prob) newPractice();
  const p=P.prob;
  const promptText = t.practice.prompt ? t.practice.prompt(p) : t.title(p);
  const fields=practiceFields(t,p);
  const isWord = promptText.length>34 || /[a-z]{4}/.test(promptText.replace(/^[A-Z]/,''));
  const pctText = P.total? Math.round(P.right/P.total*100)+'%' : '—';
  return '<div class="card">'+
    head('Practice', 'Type the answer and press Enter. Stuck? Walk it through together.',
      '<button class="btn ghost sm" id="pSteps">Walk me through it</button><button class="btn sm" id="pSkip">Skip</button>')+
    (isWord ? '<div class="probtext">'+promptText+'</div>' : '<div class="bigprob">'+promptText+'</div>')+
    '<div class="answerrow">'+
      fields.map((f,i)=>'<div><div class="alabel">'+f.label+'</div>'+
        '<input class="abox'+(f.w==='small'?' small':'')+'" id="ans'+i+'" inputmode="'+(f.mode==='text'?'text':'numeric')+
        '" autocomplete="off" placeholder="'+(f.ph||'')+'"></div>').join('')+
      '<button class="btn primary" id="pCheck" style="height:3.4rem;padding:0 1.5rem">Check</button>'+
    '</div>'+
    '<div class="feedback" id="pFeed"></div>'+
    '<div style="text-align:center;margin-top:10px"><button class="btn sage" id="pNext" style="display:none">Next problem →</button></div>'+
    '<div class="scorebar">'+
      '<span class="pill">Correct <b>'+P.right+'</b> / '+P.total+'</span>'+
      '<span class="pill">Accuracy <b>'+pctText+'</b></span>'+
      '<span class="pill streak">Streak <b>'+P.streak+'</b>'+(P.best>P.streak?' · best '+P.best:'')+'</span>'+
    '</div></div>';
}
function readFields(t,p){
  const fields=practiceFields(t,p), v={};
  fields.forEach((f,i)=>{ const el=stage().querySelector('#ans'+i); v[f.key]=el?el.value:''; });
  return v;
}
function updateScorebar(){
  const P=S.practice, sb=stage().querySelector('.scorebar');
  if(!sb) return;
  sb.innerHTML='<span class="pill">Correct <b>'+P.right+'</b> / '+P.total+'</span>'+
    '<span class="pill">Accuracy <b>'+(P.total?Math.round(P.right/P.total*100)+'%':'—')+'</b></span>'+
    '<span class="pill streak">Streak <b>'+P.streak+'</b>'+(P.best>P.streak?' · best '+P.best:'')+'</span>';
}
function checkPractice(){
  const t=topic(), P=S.practice;
  if(P.answered) return;
  const p=P.prob, v=readFields(t,p), fb=stage().querySelector('#pFeed');
  const fields=practiceFields(t,p);
  const boxes=fields.map((f,i)=>stage().querySelector('#ans'+i));
  if(boxes.every(b=>!b||b.value.trim()==='')) return;
  const ok=t.practice.check(p,v);
  P.total++;
  if(ok){
    P.right++; P.streak++; P.best=Math.max(P.best,P.streak); P.answered=true;
    boxes.forEach(b=>b&&b.classList.add('ok'));
    fb.className='feedback good';
    fb.textContent=['Yes! That is it.','Correct — nice work.','Exactly right.','Got it.','That is the one.'][rnd(0,4)]+'  Press Enter for the next one.';
    const nb=stage().querySelector('#pNext'); if(nb) nb.style.display='inline-block';
  } else {
    P.streak=0;
    boxes.forEach(b=>{ if(b){ b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),400); } });
    fb.className='feedback try';
    fb.textContent='Not yet. '+t.practice.hint(p);
  }
  updateScorebar();
}
function nextPractice(){ newPractice(); render(); requestAnimationFrame(()=>{ const a=stage().querySelector('#ans0'); if(a) a.focus(); }); }

/* =======================================================================
   FACTS — learn & drill
   ======================================================================= */
function initFacts(){
  const t=topic(), fams=t.fams(S.level);
  S.facts={fams:fams, fam:fams[0], learnIdx:1, cover:false,
           deck:[], pos:0, val:'', state:'', revealed:false,
           right:0, total:0, streak:0, best:0, missed:[], results:[]};
  buildDeck(false);
}
function buildDeck(onlyMissed){
  const t=topic(), F=S.facts;
  let cards=[];
  if(onlyMissed && F.missed.length){ cards=F.missed.slice(); }
  else F.fams.forEach(f=>{ for(let i=2;i<=12;i++) cards.push(t.card(f,i)); });
  for(let i=cards.length-1;i>0;i--){ const j=rnd(0,i); const tmp=cards[i]; cards[i]=cards[j]; cards[j]=tmp; }
  F.deck=cards; F.pos=0; F.val=''; F.state=''; F.revealed=false;
  F.results=cards.map(()=>null); F.missed=[];
}
function renderLearn(){
  const t=topic(), F=S.facts, fam=F.fam;
  const rows=[];
  for(let i=1;i<=12;i++) rows.push(t.card(fam,i));
  const shown=Math.min(F.learnIdx,12);
  const skip=[]; for(let i=1;i<=12;i++) skip.push(fam*i);
  const cur=rows[Math.min(shown,12)-1];
  return '<div class="card">'+
    head('The '+fam+'s'+(t.kind==='div'?' — divided':''),
      t.kind==='mul' ? 'Go in order first. The pattern down the right-hand column is what makes them stick.'
                     : 'Every one of these is a multiplication fact read backwards.',
      '<button class="btn sm" id="lBack"'+(shown<=1?' disabled':'')+'>Back</button>'+
      '<button class="btn primary sm" id="lNext"'+(shown>=12?' disabled':'')+'>Reveal next</button>'+
      '<button class="btn ghost sm" id="lAll">Show all</button>'+
      '<button class="btn ghost sm" id="lCover">'+(F.cover?'Uncover':'Cover answers')+'</button>')+
    '<div class="btnrow" style="margin-bottom:14px">'+
      F.fams.map(f=>'<button class="btn sm'+(f===fam?' primary':'')+'" data-fam="'+f+'">'+f+'s</button>').join('')+
    '</div>'+
    (t.kind==='mul'
      ? '<div class="note" style="margin-top:0"><b>Count by '+fam+'s:</b> '+skip.map((v,i)=>i<shown?'<b>'+v+'</b>':'<span style="opacity:.3">'+v+'</span>').join(' · ')+
        '<br>Saying this sequence out loud is the single fastest way to learn a table — the answers are already in order.</div>'
      : '')+
    '<div style="margin-top:6px">'+rows.map((r,i)=>{
        const on=i===shown-1, vis=i<shown;
        return '<div class="rung'+(on?' on':'')+(F.cover&&!on?' hid':'')+(vis?'':' dim')+'">'+
          '<span class="rq">'+r.q+' =</span>'+
          '<span class="ra">'+(vis?r.a:'?')+'</span>'+
          (vis&&t.kind==='mul'?'<span class="rskip">'+(i===0?'one '+fam:(i+1)+' × '+fam)+'</span>':'')+'</div>';
      }).join('')+'</div>'+
    (cur?'<div class="narr"><div class="lbl">Trick for this one</div><p>'+cur.hook+'</p></div>':'')+
    '<div class="note"><b>How to use this page:</b> reveal them in order once, saying each out loud. Then hit "Cover answers" and go down the list again from memory. When that feels easy, switch to Drill — shuffled and out of order is the real test.</div>'+
    '</div>';
}
function renderDrill(){
  const F=S.facts;
  if(!F.deck.length) buildDeck(false);
  if(F.pos>=F.deck.length) return renderDrillDone();
  const c=F.deck[F.pos];
  const bar='<div class="deckbar">'+F.results.map((r,i)=>
    '<i class="'+(i===F.pos?'now':(r==='ok'?'done':r==='miss'?'miss':''))+'"></i>').join('')+'</div>';
  return '<div class="card">'+
    head('Drill — card '+(F.pos+1)+' of '+F.deck.length, 'Type the answer and press Enter. Missed cards come back around.',
      '<button class="btn ghost sm" id="dShuffle">Reshuffle</button>')+
    bar+
    '<div class="deckwrap"><div class="fcard'+(F.state==='ok'?' right':F.state==='bad'?' wrong':'')+'">'+
      '<div class="fq">'+c.q+'</div>'+
      '<input class="fans'+(F.state==='ok'?' ok':F.state==='bad'?' bad':'')+'" id="fAns" inputmode="numeric" autocomplete="off" value="'+F.val+'">'+
      (F.revealed?'<div class="freveal">'+c.q+' = '+c.a+'</div><div class="fhint">'+c.hook+'</div>':'')+
    '</div></div>'+
    '<div class="btnrow" style="justify-content:center;margin-top:16px">'+
      (F.revealed?'<button class="btn primary" id="dNext">Next card →</button>':'<button class="btn sm" id="dShow">Show me</button>')+
    '</div>'+
    '<div class="scorebar">'+
      '<span class="pill">Correct <b>'+F.right+'</b> / '+F.total+'</span>'+
      '<span class="pill streak">Streak <b>'+F.streak+'</b>'+(F.best>F.streak?' · best '+F.best:'')+'</span>'+
    '</div></div>';
}
function renderDrillDone(){
  const F=S.facts;
  const pct=F.total?Math.round(F.right/F.total*100):0;
  const missList = F.missed.length
    ? '<div class="wl" style="justify-content:center;margin-top:10px">'+F.missed.map(c=>'<span class="box">'+c.q+' = '+c.a+'</span>').join(' ')+'</div>'
    : '<p style="text-align:center;color:var(--sage-d);font-weight:600">Every single one correct. That table is done.</p>';
  return '<div class="card">'+
    head('Deck finished', 'You got '+F.right+' of '+F.total+' right ('+pct+'%).','')+
    (F.missed.length?'<p style="text-align:center">These are the ones to work on:</p>':'')+
    missList+
    '<div class="btnrow" style="justify-content:center;margin-top:20px">'+
      (F.missed.length?'<button class="btn primary" id="dMissed">Drill just these '+F.missed.length+'</button>':'')+
      '<button class="btn'+(F.missed.length?'':' primary')+'" id="dShuffle">Shuffle the whole deck again</button>'+
    '</div></div>';
}
function checkFact(){
  const F=S.facts, c=F.deck[F.pos];
  if(F.revealed) return;
  const v=String(F.val).trim();
  if(v==='') return;
  F.total++;
  if(sameAns(v,c.a)){
    F.right++; F.streak++; F.best=Math.max(F.best,F.streak);
    F.state='ok'; F.results[F.pos]='ok';
    if(S.timer) clearTimeout(S.timer);
    S.timer=setTimeout(()=>{ advanceFact(); }, 520);
    render();
  } else {
    F.streak=0; F.state='bad'; F.revealed=true; F.results[F.pos]='miss';
    if(!F.missed.some(m=>m.q===c.q)) F.missed.push(c);
    // requeue this card a few places later
    const copy=Object.assign({},c);
    const at=Math.min(F.deck.length, F.pos+4);
    F.deck.splice(at,0,copy); F.results.splice(at,0,null);
    render();
    requestAnimationFrame(()=>{ const b=stage().querySelector('#dNext'); if(b) b.focus(); });
  }
}
function advanceFact(){
  const F=S.facts;
  F.pos++; F.val=''; F.state=''; F.revealed=false;
  render();
  requestAnimationFrame(()=>{ const el=stage().querySelector('#fAns'); if(el) el.focus(); });
}

/* =======================================================================
   WORKSHEET
   ======================================================================= */
function buildWorksheet(){
  const t=topic();
  if(t.engine==='facts'){
    const fams=t.fams(S.level), items=[];
    fams.forEach(f=>{ for(let i=2;i<=12;i++) items.push({q:t.card(f,i).q, a:t.card(f,i).a}); });
    $('#printArea').innerHTML='<div class="psheet"><h1 style="font-family:Georgia,serif">'+t.label+'</h1>'+
      '<p style="color:#666">'+t.levels[S.level-1]+' · Name: ______________  Date: ________</p>'+
      '<div style="columns:4;font-family:monospace;font-size:1.05rem;line-height:2.4">'+
      items.map(it=>'<div>'+it.q+' = ______</div>').join('')+'</div>'+
      '<h2 style="font-family:Georgia,serif;margin-top:24px">Answer key</h2><div class="pkey" style="columns:5">'+
      items.map(it=>'<div>'+it.q+' = '+it.a+'</div>').join('')+'</div></div>';
    window.print(); return;
  }
  const items=[];
  for(let i=0;i<10;i++){
    const p=t.gen(S.level);
    items.push({q: t.practice.prompt?t.practice.prompt(p):t.title(p), a: t.practice.answer(p)});
  }
  $('#printArea').innerHTML=
    '<div class="psheet"><h1 style="font-family:Georgia,serif">'+t.label+'</h1>'+
    '<p style="color:#666">'+t.levels[S.level-1]+' · Name: ______________________  Date: ____________</p>'+
    '<div class="pgrid">'+items.map((it,i)=>'<div class="pitem"><div class="n">'+(i+1)+'</div><div class="p">'+it.q+'</div></div>').join('')+'</div></div>'+
    '<div><h2 style="font-family:Georgia,serif">Answer key</h2><div class="pkey">'+
    items.map((it,i)=>'<div>'+(i+1)+'. '+it.a+'</div>').join('')+'</div></div>';
  window.print();
}

/* =======================================================================
   RENDER + WIRE
   ======================================================================= */
function render(){
  const t=topic();
  // the model must exist before we can ask whether this topic has a visual
  if(t.engine==='facts'){ if(!S.facts) initFacts(); }
  else if(!S.M) newProblem();
  $('#title').textContent=t.label;
  $('#tagline').textContent=t.tagline;
  $('#lvl').value=String(S.level);
  $('#newBtn').textContent = t.engine==='facts' ? 'Reshuffle deck' : 'New problem';
  const ab=$('#aboutBox');
  if(ABOUT[t.id]){ ab.style.display='';
    ab.innerHTML='<summary>What is this topic about?</summary><div class="abody">'+ABOUT[t.id]+'</div>'; }
  else ab.style.display='none';

  // mode tabs
  const modes=modesFor(t);
  if(!modes.some(m=>m[0]===S.mode)) S.mode=modes[modes.length-1][0]==='practice'?'watch':modes[0][0];
  $('#modeTabs').innerHTML=modes.map(m=>
    '<button role="tab" data-mode="'+m[0]+'" aria-selected="'+(m[0]===S.mode)+'">'+m[1]+'</button>').join('');

  // custom numbers box
  const cb=$('#customBox');
  if(t.custom && t.engine!=='facts'){
    cb.innerHTML='<span>or use your own:</span><input id="cA" inputmode="numeric" aria-label="first number">'+
      '<span style="font-family:var(--mono);font-size:1.05rem">'+t.custom.op+'</span>'+
      '<input id="cB" inputmode="numeric" aria-label="second number"><button class="btn sm" id="cSet">Set</button>';
  } else cb.innerHTML='';

  if(t.engine==='facts'){
    stage().innerHTML = S.mode==='learn' ? renderLearn() : renderDrill();
  } else {
    if(S.mode==='picture') stage().innerHTML=renderPicture();
    else if(S.mode==='watch') stage().innerHTML=renderWatch();
    else if(S.mode==='try'){ if(!S.try) initTry(); stage().innerHTML=renderTry(); }
    else stage().innerHTML=renderPractice();
  }
  wire();
}

function wire(){
  const q=id=>stage().querySelector(id);
  const on=(id,fn)=>{ const e=q(id); if(e) e.addEventListener('click',fn); };
  const t=topic();

  // watch
  const total = S.M ? (t.engine==='grid' ? S.M.phases.length : S.M.steps.length) : 0;
  on('#wNext',()=>{ S.watchIdx=Math.min(S.watchIdx+1,total-1); render(); });
  on('#wBack',()=>{ S.watchIdx=Math.max(0,S.watchIdx-1); render(); });
  on('#wAll',()=>{ S.watchIdx=total-1; render(); });
  on('#wReset',()=>{ S.watchIdx=0; render(); });

  // picture interactions
  stage().querySelectorAll('.acell').forEach(el=>el.addEventListener('click',()=>{
    const k=el.getAttribute('data-k'); S.ui.areaShown[k]=!S.ui.areaShown[k]; render(); }));
  on('#areaAll',()=>{ const ax=decompose(S.prob.a).length, bx=decompose(S.prob.b).length;
    for(let r=0;r<bx;r++) for(let c=0;c<ax;c++) S.ui.areaShown[r+'-'+c]=true; render(); });
  on('#areaReset',()=>{ S.ui.areaShown={}; render(); });
  on('#shNext',()=>{ S.ui.shareStep++; render(); });
  on('#shBack',()=>{ S.ui.shareStep=Math.max(0,S.ui.shareStep-1); render(); });
  on('#shAll',()=>{ S.ui.shareStep=99; render(); });

  // you try
  stage().querySelectorAll('.ci:not(.scratch)').forEach(el=>{
    el.addEventListener('input',()=>handleGridInput(el));
    el.addEventListener('focus',()=>el.select());
  });
  // scratch marks are free-form; just remember them so a re-render does not wipe them
  stage().querySelectorAll('.ci.scratch').forEach(el=>{
    el.addEventListener('input',()=>{ if(S.try) S.try.scratch[el.getAttribute('data-sc')]=el.value; });
  });
  stage().querySelectorAll('.si').forEach(el=>{
    el.addEventListener('input',()=>handleStepInput(el,false));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); handleStepInput(el,true); } });
    el.addEventListener('focus',()=>el.select());
  });
  on('#tClear',()=>{ initTry(); rerender(0); });
  on('#tStep',showThisStep);
  on('#tAnother',tryAnother);
  on('#tAnother2',tryAnother);
  if(S.mode==='try'){
    requestAnimationFrame(()=>{
      const f=nextSlot();
      if(f>=0 && document.activeElement===document.body){
        const el=stage().querySelector('[data-s="'+f+'"]'); if(el) el.focus();
      }
    });
  }

  // practice
  on('#pCheck',checkPractice);
  on('#pSkip',nextPractice);
  on('#pNext',nextPractice);
  on('#pSteps',()=>{ setProblem(S.practice.prob); S.mode='watch'; render(); });
  const fields = S.mode==='practice' && S.practice.prob ? practiceFields(t,S.practice.prob) : [];
  fields.forEach((f,i)=>{
    const el=q('#ans'+i); if(!el) return;
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault();
        if(S.practice.answered) nextPractice(); else checkPractice(); }
    });
  });
  if(S.mode==='practice') requestAnimationFrame(()=>{
    const a=q('#ans0'); if(a && document.activeElement===document.body) a.focus(); });

  // facts
  stage().querySelectorAll('[data-fam]').forEach(el=>el.addEventListener('click',()=>{
    S.facts.fam=Number(el.getAttribute('data-fam')); S.facts.learnIdx=1; render(); }));
  on('#lNext',()=>{ S.facts.learnIdx=Math.min(12,S.facts.learnIdx+1); render(); });
  on('#lBack',()=>{ S.facts.learnIdx=Math.max(1,S.facts.learnIdx-1); render(); });
  on('#lAll',()=>{ S.facts.learnIdx=12; render(); });
  on('#lCover',()=>{ S.facts.cover=!S.facts.cover; render(); });
  const fa=q('#fAns');
  if(fa){
    fa.addEventListener('input',()=>{ S.facts.val=fa.value; });
    fa.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault();
      if(S.facts.revealed) advanceFact(); else checkFact(); } });
    if(document.activeElement===document.body) requestAnimationFrame(()=>fa.focus());
  }
  on('#dShow',()=>{ const F=S.facts; F.revealed=true; F.state='bad'; F.streak=0;
    const c=F.deck[F.pos];
    if(F.results[F.pos]===null){ F.total++; F.results[F.pos]='miss'; if(!F.missed.some(m=>m.q===c.q)) F.missed.push(c); }
    render(); });
  on('#dNext',advanceFact);
  on('#dShuffle',()=>{ buildDeck(false); S.facts.right=0; S.facts.total=0; S.facts.streak=0; render(); });
  on('#dMissed',()=>{ buildDeck(true); S.facts.right=0; S.facts.total=0; S.facts.streak=0; render(); });

  // custom numbers — these live in #customBox, OUTSIDE #stage, so they must be
  // looked up on the document; the stage-scoped q() silently returned null and the
  // Set button did nothing at all.
  const cset=document.querySelector('#cSet');
  if(cset) cset.addEventListener('click',()=>{
    const ea=document.querySelector('#cA'), eb=document.querySelector('#cB');
    const a=parseInt(ea.value,10), b=parseInt(eb.value,10);
    if(!a||!b){ alert('Enter two whole numbers.'); return; }
    const err=t.custom.validate(a,b);
    if(err){ alert(err); return; }
    setProblem(t.custom.apply(a,b));
    if(S.mode==='practice') S.mode='watch';
    if(S.mode==='try') initTry();
    render();
  });
  // Enter in either box should also set the problem
  ['#cA','#cB'].forEach(sel=>{
    const el=document.querySelector(sel); if(!el) return;
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); cset && cset.click(); } });
  });
}

/* ---------------- top-level controls ---------------- */
function fillTopicSelect(){
  let html='';
  GROUPS.forEach(g=>{
    html += '<optgroup label="'+g+'">';
    TOPICS.filter(t=>t.group===g).forEach(t=> html+='<option value="'+t.id+'">'+t.label+'</option>');
    html += '</optgroup>';
  });
  $('#topic').innerHTML=html;
  $('#topic').value=S.topicId;
}
function fillLevelSelect(){
  const t=topic();
  if(S.level>t.levels.length) S.level=t.levels.length;
  $('#lvl').innerHTML=t.levels.map((l,i)=>'<option value="'+(i+1)+'">'+(i+1)+' · '+l+'</option>').join('');
  $('#lvl').value=String(S.level);
}
function switchTopic(id){
  S.levelMemo[S.topicId]=S.level;
  S.topicId=id;
  const t=topic();
  S.level=Math.min(S.levelMemo[id]||1, t.levels.length);
  S.M=null; S.prob=null; S.try=null; S.facts=null; S.watchIdx=0;
  S.tryStats={solved:0,clean:0};
  S.practice={prob:null,right:0,total:0,streak:0,best:0,answered:false};
  S.mode = t.engine==='facts' ? 'learn' : 'watch';
  if(t.engine!=='facts'){ newProblem(); newPractice(); }
  $('#topic').value=S.topicId;
  fillLevelSelect(); render();
}
$('#topic').addEventListener('change',e=>switchTopic(e.target.value));
$('#lvl').addEventListener('change',e=>{
  S.level=Number(e.target.value);
  S.M=null; S.try=null; S.facts=null; S.watchIdx=0;
  S.tryStats={solved:0,clean:0};
  S.practice={prob:null,right:0,total:0,streak:0,best:0,answered:false};
  const t=topic();
  if(t.engine==='facts') initFacts(); else { newProblem(); newPractice(); }
  render();
});
document.getElementById('modeTabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-mode]'); if(!b) return;
  S.mode=b.dataset.mode;
  if(S.mode==='try' && !S.try) initTry();
  render();
});
$('#newBtn').addEventListener('click',()=>{
  const t=topic();
  if(t.engine==='facts'){ buildDeck(false); S.facts.right=0; S.facts.total=0; S.facts.streak=0; render(); return; }
  if(S.mode==='practice'){ nextPractice(); return; }
  newProblem();
  if(S.mode==='try') initTry();
  render();
});
$('#printBtn').addEventListener('click',buildWorksheet);

// dev handle used by the test harness; harmless in normal use
window.__mt = {S:S, TOPICS:TOPICS, BY_ID:BY_ID, topic:topic, render:render, initTry:initTry,
               nextSlot:nextSlot, trySolved:trySolved, switchTopic:switchTopic,
               newProblem:newProblem, newPractice:newPractice, practiceFields:practiceFields,
               modesFor:modesFor, evalSteps:evalSteps, exprText:exprText, gcd:gcd, lcm:lcm, simp:simp, rd:rd};

fillTopicSelect(); fillLevelSelect(); initFacts(); render();
})();
</script>
