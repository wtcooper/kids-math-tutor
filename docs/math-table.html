reg({
  id:'factors', label:'Factors, GCF & LCM', group:'Whole numbers', engine:'steps',
  tagline:'Factors divide into a number. Multiples are what it divides into.',
  levels:['Small numbers','Up to 30','Up to 48','Up to 72'],
  gen(level){
    const hi=[20,30,48,72][level-1], lo=[4,6,8,12][level-1];
    let a,b,guard=0;
    do{ a=rnd(lo,hi); b=rnd(lo,hi); guard++; }
    while((a===b || lcm(a,b)>420) && guard<80);
    return {a:a,b:b};
  },
  title(p){ return 'GCF and LCM of '+p.a+' and '+p.b; },
  build(prob){
    const a=prob.a, b=prob.b, fa=factorsOf(a), fb=factorsOf(b), g=gcd(a,b), l=lcm(a,b);
    const shared=fa.filter(x=>fb.indexOf(x)>=0);
    const listHTML=(arr,mark)=> '<div class="wl">'+arr.map(x=>
        mark.indexOf(x)>=0 ? '<span class="box">'+x+'</span>' : '<span class="mut">'+x+'</span>').join('<span class="op">,</span>')+'</div>';
    const mults=k=>{ const o=[]; for(let i=1;i*k<=l;i++) o.push(i*k); return o; };
    const ma=mults(a), mb=mults(b);
    const steps=[
      {lbl:'List every factor of '+a,
       say:'A factor divides in with nothing left over. Walk up from 1 and check each one.',
       show:listHTML(fa,shared)},
      {lbl:'List every factor of '+b,
       say:'The highlighted numbers are the ones both lists share: '+shared.join(', ')+'.',
       show:listHTML(fb,shared)},
      {lbl:'The greatest common factor is the biggest number in both lists',
       say:'Both '+a+' and '+b+' can be divided by '+shared.join(', ')+'. The largest of those is '+g+'.',
       show:'<div class="wl">GCF('+a+', '+b+') = <span class="grn">'+g+'</span></div>',
       ask:[{label:'GCF', expect:String(g), w:3}]},
      {lbl:'Now count up in '+a+'s and in '+b+'s',
       say:'Multiples run the other direction — keep adding the number to itself until the two lists collide.',
       show:'<div class="wl"><span class="mut">'+a+'s:</span> '+ma.map(x=>x===l?'<span class="box">'+x+'</span>':'<span class="mut">'+x+'</span>').join(', ')+'</div>'+
            '<div class="wl"><span class="mut">'+b+'s:</span> '+mb.map(x=>x===l?'<span class="box">'+x+'</span>':'<span class="mut">'+x+'</span>').join(', ')+'</div>'},
      {lbl:'The least common multiple is the first number in both lists',
       say:'The first place the two counts meet is '+l+'.',
       show:'<div class="wl">LCM('+a+', '+b+') = <span class="grn">'+l+'</span></div>',
       ask:[{label:'LCM', expect:String(l), w:4}]}
    ];
    return {
      title:'GCF and LCM of '+a+' and '+b,
      steps:steps, answerText:'GCF '+g+', LCM '+l,
      picture(){
        const onlyA=fa.filter(x=>shared.indexOf(x)<0), onlyB=fb.filter(x=>shared.indexOf(x)<0);
        const col=(t,arr,cls)=>'<div style="flex:1 1 150px"><div class="alabel" style="text-align:left">'+t+'</div><div class="wl">'+
          (arr.length?arr.map(x=>'<span class="'+cls+'">'+x+'</span>').join('<span class="op">,</span>'):'<span class="mut">—</span>')+'</div></div>';
        return {
          head:{title:'Factors of '+a+' and '+b+', side by side', sub:'The overlap in the middle is what they have in common. The biggest number there is the GCF.'},
          body:'<div style="display:flex;gap:18px;flex-wrap:wrap;background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:16px 20px">'+
            col('Only '+a, onlyA, 'mut')+col('Shared', shared, 'hi')+col('Only '+b, onlyB, 'mut')+'</div>'+
            '<div class="note"><b>The shortcut worth knowing:</b> GCF × LCM = the two numbers multiplied together. Here '+g+' × '+l+' = '+fmt(g*l)+
            ', and '+a+' × '+b+' = '+fmt(a*b)+'. So once you have the GCF you can get the LCM by dividing: '+a+' × '+b+' ÷ '+g+' = '+l+'.</div>'+
            '<div class="note"><b>Where you actually use these:</b> the GCF is what you divide by to simplify a fraction. The LCM is the common denominator when you add fractions.</div>'
        };
      }
    };
  },
  practice:{
    fields:[{key:'g',label:'GCF',w:'small'},{key:'l',label:'LCM',w:'small'}],
    check(p,v){ return num(v.g)===gcd(p.a,p.b) && num(v.l)===lcm(p.a,p.b); },
    answer(p){ return 'GCF '+gcd(p.a,p.b)+', LCM '+lcm(p.a,p.b); },
    hint(p){ return 'The GCF divides into both. The LCM is what both divide into.'; }
  }
});

reg({
  id:'pemdas', label:'Order of operations', group:'Whole numbers', engine:'steps',
  tagline:'Parentheses, exponents, then × and ÷, then + and − — left to right within each level.',
  levels:['Multiply before adding','Parentheses','Longer chains','Exponents'],
  gen(level){
    const tpls=PEM_TEMPLATES[level];
    // two identical reductions (6 × 5 − 6 × 5) would narrate the same words twice
    const repeats=st=>{ const seen={}; for(let i=0;i<st.length;i++){
      const k=st[i].a+st[i].op+st[i].b; if(seen[k]) return true; seen[k]=1; } return false; };
    let tk,res,guard=0;
    do{ tk=pick(tpls)(); res=evalSteps(tk); guard++; }

           res.steps.length<2 || repeats(res.steps)) && guard<160);
    return {tokens:tk};
  },
  title(p){ return exprText(p.tokens); },
  build(prob){
    const ev=evalSteps(prob.tokens);
    const WHY={paren:'It is inside the parentheses, and parentheses always go first.',

        const RULES=[['P','Parentheses','Anything inside brackets, innermost first','paren'],
                     ['E','Exponents','Powers and roots','exp'],
                     ['MD','Multiply & Divide','Left to right — neither one outranks the other','md'],
                     ['AS','Add & Subtract','Left to right, last of all','as']];
        return {
          head:{title:'The order, and where this problem lands on it', sub:'PEMDAS is a priority list, not a left-to-right reading order.'},
          body:'<div style="display:flex;flex-direction:column;gap:8px">'+RULES.map(r=>{
              const hits=order.filter(o=>o.why===r[3]);

                '</div>';

            '<div class="note"><b>The trap:</b> MD and AS are each one level, not two. In 20 − 6 + 3 you do the subtraction first because it comes first left to right — the answer is 17, not 11. Same for × and ÷.</div>'

/* =======================================================================
   TOPICS 3 — fractions
   ======================================================================= */
// pick a numerator that leaves the fraction already in lowest terms, so the
// PROBLEM looks like a textbook problem (the ANSWER can still need simplifying)
function coprimeNum(d){
  const opts=[]; for(let i=1;i<d;i++) if(gcd(i,d)===1) opts.push(i);
  return opts.length ? pick(opts) : 1;
}
function parseFrac(s){
  s=String(s).trim().replace(/\s+/g,' ');
  if(s==='') return null;
  let m=s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const w=Number(m[1]), n=Number(m[2]), d=Number(m[3]); if(!d) return null;
         const sg=w<0?-1:1; return {n:sg*(Math.abs(w)*d+n), d:d}; }
  m=s.match(/^(-?\d+)\s*\/\s*(\d+)$/);
  if(m){ const d=Number(m[2]); if(!d) return null; return {n:Number(m[1]), d:d}; }
  m=s.match(/^(-?\d+)$/);
  if(m) return {n:Number(m[1]), d:1};
  return null;
}
function fracEq(v, n, d, strict){
  const p=parseFrac(v); if(!p) return false;
  if(strict){ const [sn,sd]=simp(n,d); const [pn2,pd]=simp(p.n,p.d); return pn2===sn && pd===sd && p.d===sd; }
  return p.n*d === n*p.d;
}
const FRAC_FIELD = [{key:'q', label:'Answer  (like 3/4 or 1 1/2)', w:'wide', mode:'text'}];

/* twin bars showing two fractions of the same whole, re-divided */
function twoBars(n1,d1,n2,d2,lab1,lab2){
  return '<div style="margin:6px 0 2px">'+
    '<div class="fbarlbl">'+lab1+'</div>'+fracBar(d1,n1,'on')+
    '<div class="fbarlbl" style="margin-top:12px">'+lab2+'</div>'+fracBar(d2,n2,'on2')+'</div>';
}

/* ---------------- EQUIVALENT FRACTIONS & SIMPLIFYING ---------------- */
reg({
  id:'frac-equiv', label:'Equivalent fractions & simplifying', group:'Fractions', engine:'steps',
  tagline:'Multiply or divide the top and bottom by the same thing and the fraction stays the same size.',
  levels:['Small denominators','Up to twelfths','Simplify & fill the blank','Bigger numbers'],
  gen(level){
    const kind = (level>=3 && Math.random()<0.5) ? 'missing' : 'simplify';
    const dmax=[6,12,16,20][level-1], kmax=[3,5,7,9][level-1];
    let d,n,guard=0;
    do{ d=rnd(3,dmax); n=rnd(1,d-1); guard++; } while(gcd(n,d)!==1 && guard<80);
    return {kind:kind, n:n, d:d, k:rnd(2,kmax)};
  },
  kindOf(p){ return p.kind; },
  levelKinds:[['simplify'],['simplify'],['simplify','missing'],['simplify','missing']],
  title(p){ return p.kind==='simplify' ? 'Simplify '+(p.n*p.k)+'/'+(p.d*p.k)
                                       : p.n+'/'+p.d+' = ?/'+(p.d*p.k); },
  build(prob){
    const {n,d,k}=prob;
    if(prob.kind==='simplify'){
      const N=n*k, D=d*k;
      const steps=[
        {lbl:'What divides into both the top and the bottom?',
         say:'The greatest common factor of '+N+' and '+D+' is '+k+'. That is the biggest piece we can pull out of both.',
         show:'<div class="wl">GCF of '+N+' and '+D+' = <span class="hi">'+k+'</span></div>',
         ask:[{label:'GCF', expect:String(k), w:3}]},
        {lbl:'Divide the top by '+k,

         ask:[{label:'New top', expect:String(n), w:3}]},
        {lbl:'Divide the bottom by the same '+k,

         show:'<div class="wl big">'+fr(N,D)+' <span class="op">=</span> <span class="grn">'+fr(n,d)+'</span></div>',
         ask:[{label:'New bottom', expect:String(d), w:3}]}
      ];
      return {title:'Simplify '+N+'/'+D,
        lead:'<div class="wl big" style="justify-content:center">'+fr(N,D)+'</div>',
        steps:steps, answerText:n+'/'+d,
        picture(){
          return {head:{title:fr(N,D)+' and '+fr(n,d)+' are the same amount',
                        sub:'Simplifying does not make the fraction smaller — it just cuts the whole into fewer, bigger pieces.'},
                  body: twoBars(N,D,n,d, N+' of '+D+' pieces', n+' of '+d+' bigger pieces')+
                    '<div class="note"><b>Look at the bars:</b> the shaded length is identical. All we did was rub out some of the dividing lines — every '+k+
                    ' small pieces became one big piece. That is what dividing top and bottom by '+k+' does.</div>'};
        }};
    }
    const N=n*k, D=d*k;
    const steps=[
      {lbl:'What happened to the bottom number?',
       say:d+' became '+D+', so it was multiplied by '+k+'.',
       show:'<div class="wl">'+d+' <span class="op">×</span> <span class="hi">'+k+'</span> <span class="op">=</span> '+D+'</div>',
       ask:[{label:'Multiplied by', expect:String(k), w:3}]},
      {lbl:'Do exactly the same to the top',
       say:n+' × '+k+' = '+N+'. Whatever you do to the bottom you must do to the top, or you change the value.',
       show:'<div class="wl big">'+fr(n,d)+' <span class="op">=</span> <span class="grn">'+fr(N,D)+'</span></div>',
       ask:[{label:'New top', expect:String(N), w:3}]}
    ];
    return {title:n+'/'+d+' = ?/'+D,
      lead:'<div class="wl big" style="justify-content:center">'+fr(n,d)+' <span class="op">=</span> '+fr('?',D)+'</div>',
      steps:steps, answerText:N+'/'+D,
      picture(){
        return {head:{title:'Same amount, more pieces', sub:'Cutting every piece into '+k+' makes '+k+' times as many pieces — and you shade '+k+' times as many.'},
                body: twoBars(n,d,N,D, n+' of '+d, N+' of '+D)+
                  '<div class="note"><b>The rule in one line:</b> multiply top and bottom by the same number and nothing changes. Multiply only one of them and you have a different fraction entirely.</div>'};
      }};
  },
  practice:{
    fields(p){ return FRAC_FIELD; },
    prompt(p){ return p.kind==='simplify' ? 'Write '+(p.n*p.k)+'/'+(p.d*p.k)+' in lowest terms.'
                                          : 'Fill in the missing top number: '+p.n+'/'+p.d+' = ?/'+(p.d*p.k); },
    check(p,v){ return p.kind==='simplify' ? fracEq(v.q,p.n,p.d,true) : fracEq(v.q,p.n*p.k,p.d*p.k,false); },
    answer(p){ return p.kind==='simplify' ? p.n+'/'+p.d : (p.n*p.k)+'/'+(p.d*p.k); },
    hint(p){ return p.kind==='simplify' ? 'Find the biggest number that divides into both, then divide both by it.'
                                        : 'Work out what the bottom was multiplied by, then do the same on top.'; }
  }
});

            '<div class="note"><b>Which form to use:</b> mixed numbers are easier to picture and to compare. Improper fractions are easier to calculate with — that is why you convert to improper before multiplying or dividing.</div>'};
}

/* ---------------- ADD & SUBTRACT FRACTIONS ---------------- */
reg({
  id:'frac-addsub', label:'Add & subtract fractions', group:'Fractions', engine:'steps',
  tagline:'You can only add pieces that are the same size — so first make them the same size.',
  levels:['Same denominator','One denominator divides the other','Any denominators','Mixed numbers'],
  gen(level){
    let p, guard=0;
    do{
      guard++;
      const op = Math.random()<0.5 ? '+' : '-';
      if(level===1){ const d=rnd(3,12); let n1=coprimeNum(d), n2=coprimeNum(d);
        if(op==='-' && n1<n2){ const t=n1; n1=n2; n2=t; }
        p={op:op, w1:0,n1:n1,d1:d, w2:0,n2:n2,d2:d}; }
      else if(level===2){ const d=rnd(2,6), k=rnd(2,4), D=d*k;
        let a={n:coprimeNum(D),d:D}, b={n:coprimeNum(d),d:d};
        p={op:op, w1:0,n1:a.n,d1:a.d, w2:0,n2:b.n,d2:b.d}; }
      else if(level===3){ let d1,d2,g2=0;
        do{ d1=rnd(3,9); d2=rnd(3,9); }while(d1===d2||gcd(d1,d2)!==1);
        p={op:op, w1:0,n1:coprimeNum(d1),d1:d1, w2:0,n2:coprimeNum(d2),d2:d2}; }
      else { let d1=rnd(2,8), d2=rnd(2,8);
        p={op:op, w1:rnd(1,4),n1:coprimeNum(d1),d1:d1, w2:rnd(1,3),n2:coprimeNum(d2),d2:d2}; }
      const N1=p.w1*p.d1+p.n1, N2=p.w2*p.d2+p.n2;
      const L=lcm(p.d1,p.d2);
      const R = p.op==='+' ? N1*(L/p.d1)+N2*(L/p.d2) : N1*(L/p.d1)-N2*(L/p.d2);
      if(R>0) return p;
      if(p.op==='-'){ // swap so the answer stays positive
        const q={op:'-', w1:p.w2,n1:p.n2,d1:p.d2, w2:p.w1,n2:p.n1,d2:p.d1};
        const A=q.w1*q.d1+q.n1, B=q.w2*q.d2+q.n2, L2=lcm(q.d1,q.d2);
        if(A*(L2/q.d1)-B*(L2/q.d2)>0) return q;
      }
    } while(guard<120);
    return {op:'+', w1:0,n1:1,d1:2, w2:0,n2:1,d2:3};
  },
  title(p){ return mixText(p.w1,p.n1,p.d1)+' '+(p.op==='+'?'+':'−')+' '+mixText(p.w2,p.n2,p.d2); },
  build(prob){
    const p=prob, mixed=(p.w1>0||p.w2>0);
    const N1=p.w1*p.d1+p.n1, N2=p.w2*p.d2+p.n2;
    const L=lcm(p.d1,p.d2), f1=L/p.d1, f2=L/p.d2;
    const A=N1*f1, B=N2*f2;
    const R = p.op==='+' ? A+B : A-B;
    const g=gcd(R,L), sn=R/g, sd=L/g;
    const opw = p.op==='+' ? 'add' : 'subtract';
    const steps=[];
    const lhs = mixNode(p.w1,p.n1,p.d1)+' <span class="op">'+(p.op==='+'?'+':'−')+'</span> '+mixNode(p.w2,p.n2,p.d2);

    if(mixed){
      const asks=[];
      if(p.w1>0) asks.push({label:'First top', expect:String(N1), w:3});
      if(p.w2>0) asks.push({label:'Second top', expect:String(N2), w:3});
      steps.push({lbl:'Turn the mixed numbers into improper fractions',
        say:'Whole × bottom + top. '+(p.w1>0?p.w1+' × '+p.d1+' + '+p.n1+' = '+N1+'. ':'')+(p.w2>0?p.w2+' × '+p.d2+' + '+p.n2+' = '+N2+'.':'')+
            ' Improper fractions are far easier to combine than mixed numbers.',
        show:'<div class="wl">'+fr(N1,p.d1)+' <span class="op">'+(p.op==='+'?'+':'−')+'</span> '+fr(N2,p.d2)+'</div>',
        ask:asks});
    }
    if(p.d1!==p.d2){
      steps.push({lbl:'Find a denominator they can share',
        say:'The smallest number both '+p.d1+' and '+p.d2+' divide into is '+L+'. Halves and thirds are different-sized pieces — you cannot '+opw+' them until they match.',
        show:'<div class="wl">common denominator = <span class="hi">'+L+'</span></div>',
        ask:[{label:'Common denominator', expect:String(L), w:3}]});
      steps.push({lbl:'Rewrite both fractions over '+L,
        say:'Multiply top and bottom by whatever turns the bottom into '+L+': the first by '+f1+', the second by '+f2+'.',
        show:'<div class="wl">'+fr(A,L)+' <span class="op">'+(p.op==='+'?'+':'−')+'</span> '+fr(B,L)+'</div>',
        ask:[{label:'First top', expect:String(A), w:3},{label:'Second top', expect:String(B), w:3}]});
    }
    steps.push({lbl:'Now '+opw+' the top numbers — the bottom stays put',
      say:A+' '+(p.op==='+'?'+':'−')+' '+B+' = '+R+'. The denominator does not change: you are counting pieces, and the pieces are all '+SING[0]+'/'+L+' now.',
      show:'<div class="wl big">'+fr(R,L)+'</div>',
      ask:[{label:'Top', expect:String(R), w:3}]});
    if(g>1){
      steps.push({lbl:'Simplify',
        say:R+' and '+L+' share a factor of '+g+', so divide both by it.',
        show:'<div class="wl big">'+fr(sn,sd)+'</div>',
        ask:[{label:'Top', expect:String(sn), w:3},{label:'Bottom', expect:String(sd), w:3}]});
    }
    let answerText = fracText(sn,sd);
    if(sn>sd && sd>1){
      const W=Math.floor(sn/sd), Rr=sn-W*sd;
      steps.push({lbl:'It is top-heavy — write it as a mixed number',
        say:sn+' ÷ '+sd+' = '+W+' remainder '+Rr+'.',
        show:'<div class="wl big"><span class="grn">'+(Rr===0?String(W):mx(W,Rr,sd))+'</span></div>',
        ask: Rr===0 ? [{label:'Whole', expect:String(W), w:3}]
                    : [{label:'Whole', expect:String(W), w:3},{label:'Top', expect:String(Rr), w:3}]});
    }
    return {
      title: mixText(p.w1,p.n1,p.d1)+' '+(p.op==='+'?'+':'−')+' '+mixText(p.w2,p.n2,p.d2),
      lead:'<div class="wl big" style="justify-content:center">'+lhs+'</div>',
      steps:steps, answerText:answerText,
      picture(){
        if(mixed) return {head:{title:'Same-size pieces first', sub:'Convert to improper fractions, match the denominators, then combine.'},
          body:'<div class="wl big" style="justify-content:center">'+fr(N1,p.d1)+' <span class="op">'+(p.op==='+'?'+':'−')+'</span> '+fr(N2,p.d2)+
               ' <span class="op">=</span> '+fr(A,L)+' <span class="op">'+(p.op==='+'?'+':'−')+'</span> '+fr(B,L)+' <span class="op">=</span> '+niceFrac(sn,sd)+'</div>'+
               '<div class="note"><b>Why improper first:</b> mixed numbers hide the pieces. Once everything is a single top-heavy fraction over one shared bottom, adding is just counting.</div>'};
        return {head:{title:'Why the denominators have to match', sub:'Look at the piece sizes — you cannot count them together until they are cut the same way.'},
          body:'<div class="fbarlbl">'+p.n1+'/'+p.d1+' — pieces this big</div>'+fracBar(p.d1,p.n1,'on')+
               '<div class="fbarlbl" style="margin-top:12px">'+p.n2+'/'+p.d2+' — pieces this big</div>'+fracBar(p.d2,p.n2,'on2')+
               '<div class="fbarlbl" style="margin-top:18px">Both re-cut into '+L+"ths — now they match</div>"+
               fracBar(L,A,'on')+fracBar(L,B,'on2')+
               '<div class="note"><b>Read the bars:</b> '+p.n1+'/'+p.d1+' covers the same length as '+A+'/'+L+', and '+p.n2+'/'+p.d2+' covers the same as '+B+'/'+L+
               '. Nothing changed size — we just cut both into pieces small enough to count together. '+A+' '+(p.op==='+'?'+':'−')+' '+B+' = '+R+' of those pieces.</div>'};
      }
    };
  },
  practice:{
    fields(p){ return FRAC_FIELD; },
    prompt(p){ return mixText(p.w1,p.n1,p.d1)+' '+(p.op==='+'?'+':'−')+' '+mixText(p.w2,p.n2,p.d2); },
    check(p,v){ const t=fracTarget(p); return fracEq(v.q,t[0],t[1],false); },
    answer(p){ const t=fracTarget(p); return fracText(t[0],t[1]); },
    hint(p){ return p.d1===p.d2 ? 'Same bottom already — just combine the tops.'
      : 'Find the smallest number both '+p.d1+' and '+p.d2+' go into, rewrite both fractions over it, then combine the tops.'; }
  }
});
function mixText(w,n,d){ if(!w) return n+'/'+d; if(!n) return String(w); return w+' '+n+'/'+d; }
function mixNode(w,n,d){ if(!w) return fr(n,d); if(!n) return String(w); return mx(w,n,d); }
function fracTarget(p){
  const N1=p.w1*p.d1+p.n1, N2=p.w2*p.d2+p.n2, L=lcm(p.d1,p.d2);
  const R = p.op==='+' ? N1*(L/p.d1)+N2*(L/p.d2) : N1*(L/p.d1)-N2*(L/p.d2);
  return simp(R,L);
}

reg({

      const W=Math.floor(sn/sd), Rr=sn-W*sd;
      steps.push({lbl:'Write the top-heavy answer as a mixed number',
        say:sn+' ÷ '+sd+' = '+W+(Rr?' remainder '+Rr:' exactly'),
        show:'<div class="wl big"><span class="grn">'+(Rr===0?String(W):mx(W,Rr,sd))+'</span></div>',
        ask: Rr===0?[{label:'Whole', expect:String(W), w:3}]
                   :[{label:'Whole', expect:String(W), w:3},{label:'Top', expect:String(Rr), w:3}]});
    }
    return {
      title: mixText(p.w1,p.n1,p.d1)+' '+(p.kind==='mul'?'×':'÷')+' '+mixText(p.w2,p.n2,p.d2),
      lead:'<div class="wl big" style="justify-content:center">'+mixNode(p.w1,p.n1,p.d1)+' <span class="op">'+(p.kind==='mul'?'×':'÷')+
           '</span> '+mixNode(p.w2,p.n2,p.d2)+'</div>',
      steps:steps, answerText:answerText,
      picture(){
        if(p.kind==='mul' && !mixed && p.d1<=8 && p.d2<=8){
          let cells='';
          for(let r=0;r<p.d2;r++) for(let c=0;c<p.d1;c++){
            const inA=c<p.n1, inB=r<p.n2;
            cells += '<div class="'+(inA&&inB?'ab':inA?'a':inB?'b':'')+'"></div>';
          }
          return {head:{title:'"Of" means multiply', sub:p.n1+'/'+p.d1+' × '+p.n2+'/'+p.d2+' asks: what is '+p.n2+'/'+p.d2+' <i>of</i> '+p.n1+'/'+p.d1+'?'},
            body:'<div style="display:flex;justify-content:center"><div class="fgrid" style="grid-template-columns:repeat('+p.d1+',1fr)">'+cells+'</div></div>'+
              '<div class="fbarlbl" style="text-align:center;margin-top:10px">'+p.n1+' of '+p.d1+' columns, then '+p.n2+' of '+p.d2+
              ' rows. The dark overlap is '+(p.n1*p.n2)+' cells out of '+(p.d1*p.d2)+'.</div>'+
              '<div class="note"><b>This is why you multiply straight across:</b> the tops count the overlapping rows and columns ('+p.n1+' × '+p.n2+' = '+(p.n1*p.n2)+
              '), and the bottoms count all the cells the whole got cut into ('+p.d1+' × '+p.d2+' = '+(p.d1*p.d2)+'). '+
              'Notice the answer is <i>smaller</i> than both fractions — multiplying by less than one always shrinks things.</div>'};
        }
        if(p.kind==='div'){
          return {head:{title:'What dividing by a fraction really asks', sub:'"'+fracText(N1,p.d1)+' ÷ '+fracText(N2,p.d2)+'" means: how many '+fracText(N2,p.d2)+'-sized pieces fit into '+fracText(N1,p.d1)+'?'},
            body:'<div class="fbarlbl">'+fracText(N1,p.d1)+' — the amount we have</div>'+fracBar(Math.max(p.d1,1),Math.min(N1,p.d1),'on')+
              '<div class="fbarlbl" style="margin-top:12px">'+fracText(N2,p.d2)+' — the size of each scoop</div>'+fracBar(p.d2,Math.min(N2,p.d2),'on2')+
              '<div class="note"><b>Why flipping works:</b> ask "how many halves are in 3?" The answer is 6 — you <i>multiplied</i> by 2. Smaller scoops mean more of them, so dividing by a fraction less than one always makes the answer bigger. Flipping and multiplying is the shortcut for that.</div>'};
        }
        return {head:{title:'Convert, then multiply straight across', sub:'Mixed numbers have to become improper fractions before you multiply.'},
          body:'<div class="wl big" style="justify-content:center">'+mixNode(p.w1,p.n1,p.d1)+' <span class="op">'+(p.kind==='mul'?'×':'÷')+'</span> '+
            mixNode(p.w2,p.n2,p.d2)+' <span class="op">=</span> '+fr(N1,p.d1)+' <span class="op">'+(p.kind==='mul'?'×':'÷')+'</span> '+fr(N2,p.d2)+'</div>'+
            '<div class="note"><b>The classic mistake:</b> multiplying the whole numbers together and the fractions together separately. That is not how it works — convert to improper fractions first, every time.</div>'};
      }
    };
  },
  practice:{
    fields(p){ return FRAC_FIELD; },
    prompt(p){ return mixText(p.w1,p.n1,p.d1)+' '+(p.kind==='mul'?'×':'÷')+' '+mixText(p.w2,p.n2,p.d2); },
    check(p,v){ const t=mdTarget(p); return fracEq(v.q,t[0],t[1],false); },
    answer(p){ const t=mdTarget(p); return fracText(t[0],t[1]); },
    hint(p){ return p.kind==='mul' ? 'Tops together, bottoms together. Convert mixed numbers first.'
                                   : 'Flip the second fraction, change ÷ to ×, then go straight across.'; }
  }
});
function mdTarget(p){
  const N1=p.w1*p.d1+p.n1, N2=p.w2*p.d2+p.n2;
  return p.kind==='mul' ? simp(N1*N2, p.d1*p.d2) : simp(N1*p.d2, p.d1*N2);
}

/* ---------------- ADD & SUBTRACT DECIMALS (column grid) ---------------- */
function decColPlace(i, dotAt){ return i<dotAt ? PLACES[dotAt-1-i] : DPLACES[i-dotAt]; }
reg({
  id:'dec-addsub', label:'Add & subtract decimals', group:'Decimals & percents', engine:'grid',
  tagline:'Line up the decimal points — not the right-hand edges — and everything else is normal.',
  levels:['Tenths','Hundredths','Different lengths','Across zeros'],
  gen(level){
    const op = level===4 ? '-' : (Math.random()<0.5?'+':'-');
    let a,b;
    if(level===1){ a=rnd(15,899)/10; b=rnd(15,499)/10; }
    else if(level===2){ a=rnd(150,8999)/100; b=rnd(150,4999)/100; }
    else if(level===3){ a=rnd(150,8999)/100; b=rnd(15,499)/10; }
    else { // "across zeros": whole number on top, so the borrow travels through .00.
           // b is built strictly below a so the swap below can never flip them and
           // put the decimal on top, which would defeat the whole point of the level.
           // the hundredths digit must be non-zero, otherwise the borrow starts at the
           // tenths column and never has to travel across a zero at all
           a=rnd(20,90); b=(rnd(1,a-1)*100 + rnd(0,9)*10 + rnd(1,9))/100; }
    a=rd(a,2); b=rd(b,2);
    if(op==='-' && b>a){ const t=a; a=b; b=t; }
    if(op==='-' && a===b) a=rd(a+1.5,2);
    return {a:a,b:b,op:op};
  },
  kindOf(p){ return p.op==='+'?'add':'sub'; },
  levelKinds:[['add','sub'],['add','sub'],['add','sub'],['sub']],
  title(p){ return trimNum(p.a)+' '+(p.op==='+'?'+':'−')+' '+trimNum(p.b); },
  build(prob){
    const {a,b,op}=prob;
    const dp=Math.max(decPlaces(a),decPlaces(b),1);
    const As=a.toFixed(dp), Bs=b.toFixed(dp);
    const ai=As.split('.')[0], af=As.split('.')[1], bi=Bs.split('.')[0], bf=Bs.split('.')[1];
    const il=Math.max(ai.length,bi.length);
    const aStr=ai.padStart(il,'0')+af, bStr=bi.padStart(il,'0')+bf;
    const m=buildColumn(op, aStr, bStr, il);
    const n=m.n;
    const phases=[];
    m.steps.forEach((st,k)=> phases.push({t:'col',k:k}));
    if(op==='+' && m.lead>0) phases.push({t:'lead'});
    phases.push({t:'done'});
    const answer = rd(op==='+'?a+b:a-b, dp);
    function revealFor(idx){ let done=0, lead=false;
      for(let i=0;i<=idx&&i<phases.length;i++){ const p=phases[i];
        if(p.t==='col') done=p.k+1; if(p.t==='lead'||p.t==='done'){ done=n; lead=true; } }
      return {stepsDone:done, lead:lead}; }
    function narrate(idx){
      const p=phases[Math.min(idx,phases.length-1)];
      if(p.t==='lead') return {lbl:'One more column', main:'The last carry becomes a new digit on the front: '+m.lead+'.', sub:''};
      if(p.t==='done') return {lbl:'Done', main:trimNum(a)+' '+(op==='+'?'+':'−')+' '+trimNum(b)+' = '+trimNum(answer)+'.',
        sub:'The decimal point in the answer sits directly under the points above it — that is the whole trick.'};
      const st=m.steps[p.k], place=decColPlace(st.col, il);
      if(op==='+'){
        let main=st.a+' + '+st.b+' = '+(st.a+st.b);
        if(st.carryIn>0) main+=', plus the '+st.carryIn+' carried makes '+st.tot;
        main+='.';
        return {lbl:'Add the '+place, main:main,
          sub:st.carryOut>0?'Write '+st.write+' and carry '+st.carryOut+' left.':'Write '+st.write+'. Nothing to carry.'};
      }
      if(st.borrowed) return {lbl:'Regroup, then subtract the '+place,
        main:'We cannot take '+st.b+' from '+st.a+'.', sub:'Borrow from the left: this column becomes '+st.top+', and '+st.top+' − '+st.b+' = '+st.write+'.'};
      return {lbl:'Subtract the '+place, main:st.top+' − '+st.b+' = '+st.write+'.', sub:''};
    }
    const slots=[];
    for(let k=0;k<n;k++){
      const i=n-1-k, st=m.steps[k];
      slots.push({idx:slots.length, col:colIdx(i,il), expect:String(m.res[i]), val:'', state:'',
        hint: op==='+' ? st.a+' + '+st.b+(st.carryIn>0?' + '+st.carryIn+' carried':'')+' — ones digit only.'
                       : (st.borrowed?'Regroup first: '+st.top+' − '+st.b+'.':st.top+' − '+st.b+' = ?')});
    }
    if(op==='+' && m.lead>0) slots.push({idx:slots.length, col:0, expect:String(m.lead), val:'', state:'', hint:'The last carry becomes a new front digit.'});
    return {
      title: trimNum(a)+' '+(op==='+'?'+':'−')+' '+trimNum(b),
      phases:phases, narrate:narrate,
      render(idx,opts){ return renderColumnGrid(m, revealFor(idx), opts||{}); },
      slots:slots,
      renderTry(T){ const ins=slots.filter(s=>s.col!==0), lead=slots.find(s=>s.col===0);
        return renderColumnGrid(m, {stepsDone:0},
          {scratch:true, scratchVals:(T&&T.scratch)||{}, inputs:ins, leadInput:lead}); },
      tryNote:'Both numbers have been padded with zeros so every column lines up. Adding zeros on the end of a decimal never changes its value.',
      answerText: trimNum(answer), answer:answer,
      picture(){
        return {head:{title:'Why lining up the points matters', sub:'Digits only add together if they mean the same thing.'},
          body:'<div class="mathwrap"><div>'+renderColumnGrid(m,{stepsDone:0},{}).replace('<div class="mathwrap"><div>','').replace('</div></div>','')+'</div></div>'+
            '<div class="note"><b>What went wrong when it goes wrong:</b> lining up the right-hand edges instead of the points. Written that way you end up adding tenths to hundredths, which is like adding dimes to pennies and calling them the same. Padding with zeros (writing '+trimNum(b)+' as '+Bs+') makes both numbers the same shape so every column matches.</div>'+
            '<div class="note"><b>Estimate first:</b> about '+Math.round(a)+' '+(op==='+'?'+':'−')+' '+Math.round(b)+' ≈ '+
            (op==='+'?Math.round(a)+Math.round(b):Math.round(a)-Math.round(b))+'. If your answer is ten times off, a misplaced point is almost always the reason.</div>'};
      }
    };
  },
  practice:{
    fields:[{key:'q',label:'Answer',w:''}],
    check(p,v){ const dp=Math.max(decPlaces(p.a),decPlaces(p.b));
                return rd(num(v.q),4)===rd(p.op==='+'?p.a+p.b:p.a-p.b,4); },
    answer(p){ return trimNum(rd(p.op==='+'?p.a+p.b:p.a-p.b,4)); },
    hint(p){ return 'Line up the decimal points and pad the shorter number with zeros.'; }
  }
});

/* ---------------- MULTIPLY & DIVIDE DECIMALS ---------------- */
reg({
  id:'dec-muldiv', label:'Multiply & divide decimals', group:'Decimals & percents', engine:'steps',
  tagline:'Do the whole-number problem first, then work out where the point belongs.',
  levels:['Times a whole number','Two decimals','Dividing by a decimal','Mixed'],
  gen(level){
    const kind = level===3 ? 'div' : (level===4 ? pick(['mul','div']) : 'mul');
    if(kind==='mul'){
      if(level===1) return {kind:'mul', a:rnd(15,99)/10, b:rnd(3,9)};
      return {kind:'mul', a:rnd(15,99)/10, b:rnd(11,49)/10};
    }
    const dsr=rnd(11,49)/10, q=rnd(3,49);
    return {kind:'div', b:rd(dsr,1), q:q, a:rd(dsr*q,3)};
  },
  kindOf(p){ return p.kind; },
  levelKinds:[['mul'],['mul'],['div'],['mul','div']],
  title(p){ return p.kind==='mul' ? trimNum(p.a)+' × '+trimNum(p.b) : trimNum(p.a)+' ÷ '+trimNum(p.b); },
  build(prob){
    if(prob.kind==='mul'){
      const a=prob.a, b=prob.b, da=decPlaces(a), db=decPlaces(b), tot=da+db;
      const wa=Math.round(a*Math.pow(10,da)), wb=Math.round(b*Math.pow(10,db));
      const wp=wa*wb, ans=rd(a*b, tot);
      const steps=[
        {lbl:'Ignore the points and multiply the whole numbers',
         say:'Pretend it says '+wa+' × '+wb+'. Do it exactly like any whole-number multiplication.',
         show:'<div class="wl">'+wa+' <span class="op">×</span> '+wb+' <span class="op">=</span> <span class="hi">'+fmt(wp)+'</span></div>',
         ask:[{label:wa+' × '+wb, expect:String(wp), w:6}]},
        {lbl:'Count the decimal places in the question',
         say:trimNum(a)+' has '+da+' and '+trimNum(b)+' has '+db+', so '+tot+' altogether. The answer needs exactly that many.',
         show:'<div class="wl">'+da+' <span class="op">+</span> '+db+' <span class="op">=</span> <span class="hi">'+tot+'</span> <span class="mut">decimal places</span></div>',
         ask:[{label:'Places', expect:String(tot), w:2}]},
        {lbl:'Count '+tot+' places in from the right and drop the point in',
         say:fmt(wp)+' with the point '+tot+' places from the right is '+trimNum(ans)+'.',
         show:'<div class="wl big"><span class="grn">'+trimNum(ans)+'</span></div>',
         ask:[{label:'Answer', expect:trimNum(ans), w:6}]}
      ];
      return {title:trimNum(a)+' × '+trimNum(b),
        lead:'<div class="wl big" style="justify-content:center">'+trimNum(a)+' × '+trimNum(b)+'</div>',
        steps:steps, answerText:trimNum(ans),
        picture(){
          const est=Math.round(a)*Math.round(b);
          return {head:{title:'Estimate first, then the point places itself', sub:'You rarely need to count places if you know roughly how big the answer should be.'},
            body:'<div class="wl">'+trimNum(a)+' is about '+Math.round(a)+', and '+trimNum(b)+' is about '+trimNum(Math.round(b*10)/10)+'</div>'+
              '<div class="wl">so the answer should be near <span class="hi">'+est+'</span></div>'+
              '<div class="wl" style="margin-top:10px">Digits from the whole-number multiply: <span class="mut">'+fmt(wp)+'</span></div>'+
              '<div class="wl">Only <span class="grn">'+trimNum(ans)+'</span> is anywhere near '+est+'.</div>'+
              '<div class="note"><b>Both methods agree, always.</b> Counting decimal places is the reliable rule; estimating is the check that catches you when you miscount. Use the rule, confirm with the estimate.</div>'};
        }};
    }
    const a=prob.a, b=prob.b, db=decPlaces(b);
    const nb=rd(b*Math.pow(10,db),6), na=rd(a*Math.pow(10,db),6);
    const ans=rd(a/b,6);
    const steps=[
      {lbl:'Make the divisor a whole number',
       say:'You cannot divide by '+trimNum(b)+' comfortably. Move its point '+db+' place'+(db===1?'':'s')+' right and it becomes '+nb+'.',
       show:'<div class="wl">'+trimNum(b)+' <span class="op">→</span> <span class="hi">'+nb+'</span> <span class="mut">(moved '+db+')</span></div>',
       ask:[{label:'Places moved', expect:String(db), w:2}]},
      {lbl:'Move the point in the other number exactly as far',
       say:trimNum(a)+' becomes '+trimNum(na)+'. Moving both the same amount keeps the answer identical — it is the same as multiplying top and bottom of a fraction by '+Math.pow(10,db)+'.',
       show:'<div class="wl">'+trimNum(na)+' <span class="op">÷</span> '+nb+'</div>',
       ask:[{label:'New dividend', expect:trimNum(na), w:6}]},
      {lbl:'Now it is ordinary long division',
       say:trimNum(na)+' ÷ '+nb+' = '+trimNum(ans)+'.',
       show:'<div class="wl big"><span class="grn">'+trimNum(ans)+'</span></div>',
       ask:[{label:'Answer', expect:trimNum(ans), w:6}]}
    ];
    return {title:trimNum(a)+' ÷ '+trimNum(b),
      lead:'<div class="wl big" style="justify-content:center">'+trimNum(a)+' ÷ '+trimNum(b)+'</div>',
      steps:steps, answerText:trimNum(ans),
      picture(){
        return {head:{title:'Why moving both points is allowed', sub:'A division is a fraction, and a fraction does not change when you scale top and bottom the same way.'},
          body:'<div class="wl big" style="justify-content:center">'+fr(trimNum(a),trimNum(b))+' <span class="op">=</span> '+
            fr(trimNum(a)+' × '+Math.pow(10,db), trimNum(b)+' × '+Math.pow(10,db))+' <span class="op">=</span> '+fr(trimNum(na),nb)+'</div>'+
          '<div class="note"><b>The same idea you already use with fractions.</b> Multiplying top and bottom by '+Math.pow(10,db)+
          ' keeps the value identical — it just makes the bottom a whole number so you can do normal long division.</div>'};
      }};
  },
  practice:{
    fields:[{key:'q',label:'Answer',w:''}],
    prompt(p){ return p.kind==='mul' ? trimNum(p.a)+' × '+trimNum(p.b) : trimNum(p.a)+' ÷ '+trimNum(p.b); },
    check(p,v){ return rd(num(v.q),4)===rd(p.kind==='mul'?p.a*p.b:p.a/p.b,4); },
    answer(p){ return trimNum(rd(p.kind==='mul'?p.a*p.b:p.a/p.b,4)); },
    hint(p){ return p.kind==='mul' ? 'Multiply as whole numbers, then count the decimal places in the question.'
                                   : 'Move the point in the divisor until it is whole, and move the other number the same amount.'; }
  }
});

              '<div class="note"><b>The mental-math route:</b> 10% of '+fmt(N)+' is '+trimNum(ten)+' (just move the point one place). 1% is '+trimNum(one)+
              '. Almost any percent can be built from those two: '+P+'% = '+(P>=10?Math.floor(P/10)+' lots of 10%':'')+
              (P%10?(P>=10?' plus ':'')+(P%10)+' lots of 1%':'')+' = '+trimNum(ans)+'.</div>'};

      return {title:trimNum(A)+' out of '+fmt(B),
        lead:'<div class="wl big" style="justify-content:center">'+trimNum(A)+' is what percent of '+fmt(B)+'?</div>',
        steps:steps, answerText:trimNum(pct)+'%',
        picture(){
          const w=Math.min(100,dec*100);
          return {head:{title:'How much of the bar is filled?', sub:'The full bar is '+fmt(B)+'. We have '+trimNum(A)+' of it.'},
            body:'<div class="pbar"><div class="fill" style="width:'+w+'%"></div>'+
              '<div class="mark" style="left:'+w+'%">'+trimNum(pct)+'%</div>'+
              '<div class="mark2" style="left:'+w+'%">'+trimNum(A)+'</div>'+
              '<div class="mark" style="left:100%">100%</div><div class="mark2" style="left:100%">'+fmt(B)+'</div></div>'+
              '<div class="note"><b>Which number goes on the bottom?</b> The one that represents the whole — the "of" number. '+
              trimNum(A)+' is what percent <i>of</i> '+fmt(B)+', so '+fmt(B)+' is the whole and goes underneath.</div>'};
        }};
    }
    const P=prob.p, dec=rd(P/100,4), [sn,sd]=simp(P,100);
    const steps=[
      {lbl:'As a decimal: divide by 100',
       say:'Slide the point two places left: '+P+'% becomes '+trimNum(dec)+'.',
       show:'<div class="wl">'+P+'% <span class="op">=</span> <span class="hi">'+trimNum(dec)+'</span></div>',
       ask:[{label:'Decimal', expect:trimNum(dec), w:4}]},
      {lbl:'As a fraction: put it over 100, then simplify',
       say:P+'/100 simplifies to '+sn+'/'+sd+' (both divide by '+(P/sn)+').',
       show:'<div class="wl big">'+P+'% <span class="op">=</span> '+fr(P,100)+' <span class="op">=</span> <span class="grn">'+fr(sn,sd)+'</span></div>',
       ask:[{label:'Top', expect:String(sn), w:3},{label:'Bottom', expect:String(sd), w:3}]}
    ];
    return {title:'Write '+P+'% as a decimal and a fraction',
      lead:'<div class="wl big" style="justify-content:center">'+P+'%</div>',
      steps:steps, answerText:trimNum(dec)+' or '+sn+'/'+sd,
      picture(){
        let cells='';
        for(let i=0;i<100;i++) cells += '<span class="'+(i<P?'on':'')+'"></span>';
        return {head:{title:'A hundred-square makes it obvious', sub:'"Per cent" is Latin for "per hundred". Shade '+P+' of the 100 squares.'},
          body:'<div style="display:flex;justify-content:center"><div class="pgrid100">'+cells+'</div></div>'+
            '<div class="note"><b>Three names for one amount:</b> '+P+'% shaded, '+trimNum(dec)+' of the square, or '+sn+'/'+sd+
            ' of it. Percent, decimal and fraction are three ways of saying the same thing — which is why you can always swap between them.</div>'};
      }};
  },
  practice:{
    fields(p){ return [{key:'q', label:p.kind==='whatpct'?'Percent':(p.kind==='convert'?'Decimal':'Answer'), w:''}]; },
    prompt(p){ return p.kind==='of' ? 'What is '+p.p+'% of '+fmt(p.n)+'?'
             : p.kind==='whatpct' ? trimNum(p.a)+' is what percent of '+fmt(p.b)+'?'
             : 'Write '+p.p+'% as a decimal.'; },
    check(p,v){ const t = p.kind==='of'?rd(p.n*p.p/100,4) : p.kind==='whatpct'?rd(p.a/p.b*100,4) : rd(p.p/100,4);
                return rd(num(v.q),4)===t; },
    answer(p){ return trimNum(p.kind==='of'?rd(p.n*p.p/100,4) : p.kind==='whatpct'?rd(p.a/p.b*100,4) : rd(p.p/100,4)); },
    hint(p){ return p.kind==='of' ? '10% of '+fmt(p.n)+' is '+trimNum(rd(p.n/10,4))+'. Build the answer from that.'
           : p.kind==='whatpct' ? 'Divide the part by the whole, then multiply by 100.'
           : 'Dividing by 100 moves the decimal point two places left.'; }
  }
});

/* ---------------- RATIOS & UNIT RATES ---------------- */
const RATIO_ITEMS=[['apples','$'],['notebooks','$'],['tickets','$'],['cupcakes','$'],['pencils','$'],['candles','$'],['batteries','$']];
reg({
  id:'ratio', label:'Ratios & unit rates', group:'Ratios & algebra', engine:'steps',
  tagline:'Find what one of them costs, and every other quantity is easy.',
  levels:['Simple unit rates','Equivalent ratios','Bigger numbers','Mixed'],
  gen(level){
    const kind = level===1 ? 'unit' : (level===2 ? 'equiv' : pick(['unit','equiv']));
    if(kind==='unit'){
      const item=pick(RATIO_ITEMS), n=rnd(2,9), unit=rnd(2,level>=3?25:12), m=rnd(2,15);
      return {kind:'unit', item:item[0], sym:item[1], n:n, total:n*unit, unit:unit, m:m};
    }
    const a=rnd(2,9), b=rnd(2,12), k=rnd(2,level>=3?9:5);
    return {kind:'equiv', a:a, b:b, k:k};
  },
  kindOf(p){ return p.kind; },
  levelKinds:[['unit'],['equiv'],['unit','equiv'],['unit','equiv']],
  title(p){ return p.kind==='unit' ? p.n+' '+p.item+' cost '+p.sym+fmt(p.total)+' — what do '+p.m+' cost?'
                                   : p.a+' : '+p.b+' = '+(p.a*p.k)+' : ?'; },
  build(prob){
    if(prob.kind==='unit'){
      const {n,total,unit,m,item,sym}=prob, ans=unit*m;
      const steps=[
        {lbl:'Find the unit rate — the cost of just one',
         say:'Divide both sides of the ratio by '+n+': '+sym+fmt(total)+' ÷ '+n+' = '+sym+fmt(unit)+' for one '+item.replace(/s$/,'')+'.',
         show:'<div class="wl">'+sym+fmt(total)+' <span class="op">÷</span> '+n+' <span class="op">=</span> <span class="hi">'+sym+fmt(unit)+'</span> <span class="mut">each</span></div>',
         ask:[{label:'Cost of 1', expect:String(unit), w:4}]},
        {lbl:'Scale up to '+m,
         say:m+' × '+sym+fmt(unit)+' = '+sym+fmt(ans)+'.',
         show:'<div class="wl big"><span class="grn">'+sym+fmt(ans)+'</span></div>',
         ask:[{label:'Cost of '+m, expect:String(ans), w:5}]}
      ];
      return {title:'Cost of '+m+' '+item,
        lead:'<div class="probtext">'+n+' '+item+' cost '+sym+fmt(total)+'. What do '+m+' '+item+' cost?</div>',
        steps:steps, answerText:sym+fmt(ans),
        picture(){
          return {head:{title:'A ratio table walks you there in steps', sub:'Divide down to one, then multiply up to whatever you need.'},
            body:'<div style="display:flex;justify-content:center;overflow-x:auto"><table class="rtable">'+
              '<tr><th>'+item+'</th><th>1</th><th>'+n+'</th><th>'+m+'</th></tr>'+
              '<tr><th>cost</th><td class="hi">'+sym+fmt(unit)+'</td><td>'+sym+fmt(total)+'</td><td class="hi">'+sym+fmt(ans)+'</td></tr>'+
              '</table></div>'+
              '<div class="arrowlbl" style="text-align:center">Going left divides by '+n+'. Going right multiplies by '+m+'.</div>'+
              '<div class="note"><b>Why the unit rate is worth finding:</b> once you know one '+item.replace(/s$/,'')+' costs '+sym+fmt(unit)+
              ', you can answer <i>any</i> version of the question instantly — 7 of them, 40 of them, whatever. It turns one problem into a tool.</div>'};
        }};
    }
    const {a,b,k}=prob, ans=b*k;
    const steps=[
      {lbl:'What did the first number get multiplied by?',
       say:a+' became '+(a*k)+', so the scale factor is '+k+'.',
       show:'<div class="wl">'+a+' <span class="op">×</span> <span class="hi">'+k+'</span> <span class="op">=</span> '+(a*k)+'</div>',
       ask:[{label:'Scale factor', expect:String(k), w:3}]},
      {lbl:'Do the same to the second number',
       say:b+' × '+k+' = '+ans+'. A ratio only stays the same if both parts grow by the same factor.',
       show:'<div class="wl big">'+a+' : '+b+' <span class="op">=</span> <span class="grn">'+(a*k)+' : '+ans+'</span></div>',
       ask:[{label:'Missing value', expect:String(ans), w:4}]}
    ];
    return {title:a+' : '+b+' = '+(a*k)+' : ?',
      lead:'<div class="wl big" style="justify-content:center">'+a+' : '+b+' <span class="op">=</span> '+(a*k)+' : ?</div>',
      steps:steps, answerText:String(ans),
      picture(){
        return {head:{title:'Equivalent ratios are just the same recipe, scaled', sub:'Double everything, triple everything — the mix stays the same.'},
          body:'<div style="display:flex;justify-content:center;overflow-x:auto"><table class="rtable">'+
            '<tr><th>&nbsp;</th>'+[1,2,k].map(x=>'<th>× '+x+'</th>').join('')+'</tr>'+
            '<tr><th>first</th>'+[1,2,k].map(x=>'<td'+(x===k?' class="hi"':'')+'>'+(a*x)+'</td>').join('')+'</tr>'+
            '<tr><th>second</th>'+[1,2,k].map(x=>'<td'+(x===k?' class="hi"':'')+'>'+(b*x)+'</td>').join('')+'</tr>'+
            '</table></div>'+
            '<div class="note"><b>The test for equivalence:</b> cross-multiply. '+a+' × '+ans+' = '+fmt(a*ans)+' and '+b+' × '+(a*k)+' = '+fmt(b*a*k)+
            '. Equal, so the ratios match. If they had come out different, the ratios would not be equivalent.</div>'};
      }};
  },
  practice:{
    fields:[{key:'q',label:'Answer',w:''}],
    prompt(p){ return p.kind==='unit' ? p.n+' '+p.item+' cost '+p.sym+fmt(p.total)+'. What do '+p.m+' cost?'
                                      : 'Fill in the blank:  '+p.a+' : '+p.b+' = '+(p.a*p.k)+' : ?'; },
    check(p,v){ return num(v.q)===(p.kind==='unit'?p.unit*p.m:p.b*p.k); },
    answer(p){ return String(p.kind==='unit'?p.unit*p.m:p.b*p.k); },
    hint(p){ return p.kind==='unit' ? 'Find the cost of one first, then multiply.' : 'Work out the scale factor, then apply it to the other number.'; }
  }
});

/* ---------------- INTEGERS ---------------- */
function sgn(x){ return x<0 ? '(&minus;'+Math.abs(x)+')' : String(x); }
function sgnPlain(x){ return x<0 ? '(-'+Math.abs(x)+')' : String(x); }
reg({
  id:'integers', label:'Positive & negative numbers', group:'Ratios & algebra', engine:'steps',
  tagline:'Think of the number line: sign tells you which way, size tells you how far.',
  levels:['Adding a negative','Subtracting a negative','Both mixed','Multiplying & dividing'],
  gen(level){
    if(level===1){ const a=rnd(-15,15)||3, b=-rnd(1,15); return {kind:'add', a:a, b:b}; }
    if(level===2){ const a=rnd(-15,15)||4; return {kind:'sub', a:a, b:-rnd(1,15)}; }
    if(level===3){ const a=rnd(-25,25)||5, b=(Math.random()<0.5?-1:1)*rnd(1,25);
                   return {kind:pick(['add','sub']), a:a, b:b}; }
    return {kind:pick(['mul','div']),
            a:(Math.random()<0.5?-1:1)*rnd(2,12),
            b:(Math.random()<0.5?-1:1)*rnd(2,12)};
  },
  kindOf(p){ return p.kind; },
  levelKinds:[['add'],['sub'],['add','sub'],['mul','div']],
  title(p){ const o={add:'+',sub:'−',mul:'×',div:'÷'}[p.kind];
            return p.kind==='div' ? sgnPlain(p.a*p.b)+' ÷ '+sgnPlain(p.b) : sgnPlain(p.a)+' '+o+' '+sgnPlain(p.b); },
  build(prob){
    const p=prob;
    if(p.kind==='mul' || p.kind==='div'){
      const A = p.kind==='div' ? p.a*p.b : p.a, B=p.b;
      const ans = p.kind==='mul' ? p.a*p.b : (p.a*p.b)/p.b;
      const sizeAns = Math.abs(p.kind==='mul' ? p.a*p.b : p.a);
      const neg = ans<0;
      const opw = p.kind==='mul'?'×':'÷';
      const steps=[
        {lbl:'Ignore the signs and work out the size',
         say:Math.abs(A)+' '+opw+' '+Math.abs(B)+' = '+sizeAns+'.',
         show:'<div class="wl">'+Math.abs(A)+' <span class="op">'+opw+'</span> '+Math.abs(B)+' <span class="op">=</span> <span class="hi">'+sizeAns+'</span></div>',
         ask:[{label:'Size', expect:String(sizeAns), w:4}]},
        {lbl:'Now the sign: same signs give a positive, different signs give a negative',
         say:(A<0)===(B<0) ? 'Both have the same sign, so the answer is positive: '+ans+'.'
                           : 'The signs are different, so the answer is negative: '+ans+'.',
         sub:'Count the negatives: an even number of them cancels out to positive, an odd number leaves it negative.',
         show:'<div class="wl big"><span class="grn">'+(neg?'&minus;':'')+sizeAns+'</span></div>',
         ask:[{label:'Answer', expect:String(ans), w:5, mode:'text'}]}
      ];
      return {title:sgnPlain(A)+' '+opw+' '+sgnPlain(B),
        lead:'<div class="wl big" style="justify-content:center">'+sgn(A)+' <span class="op">'+opw+'</span> '+sgn(B)+'</div>',
        steps:steps, answerText:String(ans),
        picture(){
          return {head:{title:'Why two negatives make a positive', sub:'Multiplying by a negative flips the number line around zero. Flip twice and you are back where you started.'},
            body:'<div class="wl">3 × 2 = 6</div><div class="wl">3 × (&minus;2) = &minus;6 <span class="mut">— flipped once</span></div>'+
              '<div class="wl">(&minus;3) × (&minus;2) = 6 <span class="mut">— flipped twice, back to positive</span></div>'+
              numberLine(-8,8,[{v:-6,label:'−6'},{v:0,label:'0'},{v:6,label:'6'}],null,null,null)+
              '<div class="note"><b>The rule in four lines:</b> + × + = +, − × − = +, + × − = −, − × + = −. Division follows exactly the same pattern. Count how many negatives you have: even means positive, odd means negative.</div>'};
        }};
    }
    const a=p.a, b=p.b;
    const steps=[];
    let effB=b;
    if(p.kind==='sub'){
      effB=-b;
      steps.push({lbl:'Subtracting is the same as adding the opposite',
        say:'Change the '+(b<0?'"minus a negative" into "plus a positive"':'subtraction into adding a negative')+': '+
            sgnPlain(a)+' − '+sgnPlain(b)+' becomes '+sgnPlain(a)+' + '+sgnPlain(effB)+'.',
        sub: b<0 ? 'Taking away a debt makes you richer — that is why minus a negative goes up.' : '',
        show:'<div class="wl">'+sgn(a)+' <span class="op">+</span> '+sgn(effB)+'</div>',
        ask:[{label:'The opposite of '+sgnPlain(b), expect:String(effB), w:4, mode:'text'}]});
    }
    const ans=a+effB;
    const sameSign=(a<0)===(effB<0);
    steps.push({lbl: sameSign ? 'Same signs — add the sizes and keep the sign' : 'Different signs — subtract the sizes, keep the sign of the bigger one',
      say: sameSign ? Math.abs(a)+' + '+Math.abs(effB)+' = '+Math.abs(ans)+', and both were '+(a<0?'negative':'positive')+', so the answer is '+ans+'.'
                    : 'Sizes are '+Math.abs(a)+' and '+Math.abs(effB)+'. The bigger is '+Math.max(Math.abs(a),Math.abs(effB))+', and it is '+
                      ((Math.abs(a)>Math.abs(effB)?a:effB)<0?'negative':'positive')+'. '+Math.max(Math.abs(a),Math.abs(effB))+' − '+
                      Math.min(Math.abs(a),Math.abs(effB))+' = '+Math.abs(ans)+', so the answer is '+ans+'.',
      sub:'On the number line: start at '+a+' and move '+Math.abs(effB)+' to the '+(effB<0?'left':'right')+'.',
      show:'<div class="wl big"><span class="grn">'+ans+'</span></div>',
      ask:[{label:'Answer', expect:String(ans), w:5, mode:'text'}]});
    return {title:sgnPlain(a)+' '+(p.kind==='sub'?'−':'+')+' '+sgnPlain(b),
      lead:'<div class="wl big" style="justify-content:center">'+sgn(a)+' <span class="op">'+(p.kind==='sub'?'&minus;':'+')+'</span> '+sgn(b)+'</div>',
      steps:steps, answerText:String(ans),
      picture(){
        const lo=Math.min(a,ans,0)-3, hi=Math.max(a,ans,0)+3;
        const marks=[];
        for(let v=Math.ceil(lo);v<=Math.floor(hi);v++) marks.push({v:v, cls:v===0?'':'minor', label:(v%5===0||v===a||v===ans)?String(v):undefined});
        return {head:{title:'Walk it on the number line', sub:'Start at '+a+', then move '+Math.abs(effB)+' step'+(Math.abs(effB)===1?'':'s')+' to the '+(effB<0?'left':'right')+'.'},
          body: numberLine(lo,hi,marks,ans,'lands on '+ans,{from:a,to:ans,label:(effB<0?'−':'+')+Math.abs(effB)})+
            '<div class="note"><b>The one thing to hold on to:</b> the sign says which direction, the number says how far. Adding a negative moves left. Subtracting a negative moves right — because you are taking away a backwards step, which is a forwards step.</div>'};
      }};
  },
  practice:{
    fields:[{key:'q',label:'Answer',w:'small'}],
    prompt(p){ const o={add:'+',sub:'−',mul:'×',div:'÷'}[p.kind];
               return p.kind==='div' ? sgnPlain(p.a*p.b)+' ÷ '+sgnPlain(p.b) : sgnPlain(p.a)+' '+o+' '+sgnPlain(p.b); },
    check(p,v){ return num(v.q)===intTarget(p); },
    answer(p){ return String(intTarget(p)); },
    hint(p){ return (p.kind==='mul'||p.kind==='div') ? 'Work out the size first, then count the negatives — odd means the answer is negative.'
                                                      : 'Rewrite any subtraction as adding the opposite, then think about the number line.'; }
  }
});
function intTarget(p){
  if(p.kind==='mul') return p.a*p.b;
  if(p.kind==='div') return p.a;
  return p.kind==='sub' ? p.a-p.b : p.a+p.b;
}

/* ---------------- ONE- AND TWO-STEP EQUATIONS ---------------- */
reg({
  id:'equations', label:'Solving for x', group:'Ratios & algebra', engine:'steps',
  tagline:'Whatever you do to one side, do to the other. Undo the operations in reverse.',
  levels:['Add & subtract','Multiply & divide','All one-step types','Two steps'],
  gen(level){
    const mk=(kind,amax)=>{ const a=rnd(2,amax);
      // for x ÷ a = b the answer has to divide evenly, so build x from a
      const x = kind==='div' ? a*rnd(2,9) : rnd(2,25);
      return {kind:kind, x:x, a:a}; };
    if(level===1) return mk(pick(['add','sub']), 20);
    if(level===2) return mk(pick(['mul','div']), 9);
    if(level===3) return mk(pick(['add','sub','mul','div']), 12);
    const a=rnd(2,9), x=rnd(2,15), b=rnd(2,25);
    return {kind:'two', x:x, a:a, b:b};
  },
  kindOf(p){ return p.kind; },
  levelKinds:[['add','sub'],['mul','div'],['add','sub','mul','div'],['two']],
  title(p){ return eqText(p); },
  build(prob){
    const p=prob, x=p.x, a=p.a;
    if(p.kind==='two'){
      const b=p.b, c=a*x+b;
      const steps=[
        {lbl:'Peel off the +'+b+' first',
         say:'Undo the operations in reverse order — addition and subtraction come off before multiplication and division. Subtract '+b+' from both sides: '+c+' − '+b+' = '+(c-b)+'.',
         show:'<div class="wl">'+a+'x <span class="op">=</span> <span class="hi">'+(c-b)+'</span></div>',
         ask:[{label:a+'x =', expect:String(c-b), w:4}]},
        {lbl:'Now undo the × '+a,
         say:a+'x means '+a+' times x, so divide both sides by '+a+': '+(c-b)+' ÷ '+a+' = '+x+'.',
         show:'<div class="wl big">x <span class="op">=</span> <span class="grn">'+x+'</span></div>',
         ask:[{label:'x =', expect:String(x), w:4}]},
        {lbl:'Check it',
         say:'Put '+x+' back in: '+a+' × '+x+' + '+b+' = '+(a*x)+' + '+b+' = '+c+'. ✓ Matches the original.',
         show:'<div class="wl"><span class="mut">'+a+'('+x+') + '+b+' = '+c+' ✓</span></div>'}
      ];
      return {title:eqText(p), lead:'<div class="wl big" style="justify-content:center">'+a+'x + '+b+' = '+c+'</div>',
        steps:steps, answerText:'x = '+x, picture(){ return eqPicture(p); }};
    }
    const OPS={
      add:{lhs:'x + '+a, rhs:x+a, undo:'subtract '+a+' from', calc:(x+a)+' − '+a+' = '+x, why:'x has '+a+' added to it, so take '+a+' away from both sides.'},
      sub:{lhs:'x − '+a, rhs:x-a, undo:'add '+a+' to', calc:(x-a)+' + '+a+' = '+x, why:'x has '+a+' taken away, so add '+a+' back to both sides.'},
      mul:{lhs:a+'x', rhs:a*x, undo:'divide both sides by '+a+', starting with', calc:(a*x)+' ÷ '+a+' = '+x, why:a+'x means '+a+' times x, so divide both sides by '+a+'.'},
      div:{lhs:'x ÷ '+a, rhs:x/a, undo:'multiply by '+a+',', calc:(x/a)+' × '+a+' = '+x, why:'x is being divided by '+a+', so multiply both sides by '+a+'.'}
    };
    const o=OPS[p.kind];
    const steps=[
      {lbl:'What is being done to x?',
       say:o.why+' Doing the same thing to both sides keeps the equation balanced — that is the only rule there is.',
       show:'<div class="wl">'+o.lhs+' <span class="op">=</span> '+o.rhs+'</div>'},
      {lbl:'Undo it on both sides',
       say:o.calc+', so x = '+x+'.',
       show:'<div class="wl big">x <span class="op">=</span> <span class="grn">'+x+'</span></div>',
       ask:[{label:'x =', expect:String(x), w:4}]},
      {lbl:'Check it',
       say:'Substitute '+x+' back into the original: '+o.lhs.replace('x',String(x))+' = '+o.rhs+'. ✓',
       show:'<div class="wl"><span class="mut">'+o.lhs.replace('x','('+x+')')+' = '+o.rhs+' ✓</span></div>'}
    ];
    return {title:eqText(p), lead:'<div class="wl big" style="justify-content:center">'+o.lhs+' = '+o.rhs+'</div>',
      steps:steps, answerText:'x = '+x, picture(){ return eqPicture(p); }};
  },
  practice:{
    fields:[{key:'q',label:'x =',w:'small'}],
    prompt(p){ return 'Solve:  '+eqText(p); },
    check(p,v){ return rd(num(v.q),4)===p.x; },
    answer(p){ return 'x = '+p.x; },
    hint(p){ return 'Get x by itself. Whatever you do to one side you must do to the other.'; }
  }
});
function eqText(p){
  const x=p.x, a=p.a;
  if(p.kind==='add') return 'x + '+a+' = '+(x+a);
  if(p.kind==='sub') return 'x − '+a+' = '+(x-a);
  if(p.kind==='mul') return a+'x = '+(a*x);
  if(p.kind==='div') return 'x ÷ '+a+' = '+(x/a);
  return a+'x + '+p.b+' = '+(a*x+p.b);
}
function eqPicture(p){
  const x=p.x,a=p.a;
  let left,right;
  if(p.kind==='add'){ left='x + '+a; right=String(x+a); }
  else if(p.kind==='sub'){ left='x − '+a; right=String(x-a); }
  else if(p.kind==='mul'){ left=a+'x'; right=String(a*x); }
  else if(p.kind==='div'){ left='x ÷ '+a; right=String(x/a); }
  else { left=a+'x + '+p.b; right=String(a*x+p.b); }
  return {head:{title:'An equation is a balance scale', sub:'The two sides weigh the same. Anything you take off one side you must take off the other, or it tips.'},
    body:'<div class="scale"><div class="pan">'+left+'</div><div class="beam"></div><div class="pan">'+right+'</div></div>'+
      '<div class="fulcrum">balanced</div>'+
      '<div class="note"><b>Why "do the same to both sides" works:</b> if two things weigh the same and you remove the same amount from each, they still weigh the same. Solving is just removing things until x is alone on its pan.</div>'+
      '<div class="note"><b>Always check.</b> Put your answer back into the original equation. If both sides come out equal, you are right — no need to wonder. Here x = '+x+' gives '+left.replace('x','('+x+')')+' = '+right+'.</div>'};
}

function svgShape(kind, w, h, unit, extra){
  const W=300, H=180, pad=36;
  const availW=W-2*pad, availH=H-2*pad;
  // ONE scale for both axes. Clamping width and height separately (as this used to)
  // silently redraws a base-20 height-2 triangle as if the height were 4, so the
  // picture stops matching its own labels.
  const scale=Math.min(availW/Math.max(w,1), availH/Math.max(h,1));
  const pw=w*scale, ph=h*scale;
  const x0=(W-pw)/2, y0=(H-ph)/2;
  const T='fill="#6E6053" font-family="monospace" font-size="13"';
  let body='';
  if(kind==='tri'){
    body='<polygon points="'+x0+','+(y0+ph)+' '+(x0+pw)+','+(y0+ph)+' '+(x0+pw*0.34)+','+y0+'" fill="rgba(190,110,78,.25)" stroke="#BE6E4E" stroke-width="2.5"/>'+
         '<line x1="'+(x0+pw*0.34)+'" y1="'+y0+'" x2="'+(x0+pw*0.34)+'" y2="'+(y0+ph)+'" stroke="#BE6E4E" stroke-width="1.5" stroke-dasharray="4 4"/>'+
         '<text x="'+(x0+pw/2)+'" y="'+(y0+ph+20)+'" text-anchor="middle" '+T+'>b = '+w+' '+unit+'</text>'+
         '<text x="'+(x0+pw*0.34+6)+'" y="'+(y0-7)+'" '+T+'>h = '+h+' '+unit+'</text>';
  } else if(kind==='para'){
    const sk=pw*0.22;
    body='<polygon points="'+(x0+sk)+','+y0+' '+(x0+pw)+','+y0+' '+(x0+pw-sk)+','+(y0+ph)+' '+x0+','+(y0+ph)+'" fill="rgba(109,142,104,.25)" stroke="#6D8E68" stroke-width="2.5"/>'+
         '<line x1="'+(x0+sk)+'" y1="'+y0+'" x2="'+(x0+sk)+'" y2="'+(y0+ph)+'" stroke="#6D8E68" stroke-width="1.5" stroke-dasharray="4 4"/>'+
         '<text x="'+(x0+pw/2)+'" y="'+(y0+ph+20)+'" text-anchor="middle" '+T+'>b = '+w+' '+unit+'</text>'+
         '<text x="'+(x0+sk+6)+'" y="'+(y0-7)+'" '+T+'>h = '+h+' '+unit+'</text>';
  } else if(kind==='prism'){
    const d=Math.max(15, Math.min(40, (parseFloat(extra)||4)*scale*0.75));
    body='<polygon points="'+x0+','+y0+' '+(x0+d)+','+(y0-d)+' '+(x0+pw+d)+','+(y0-d)+' '+(x0+pw)+','+y0+'" fill="rgba(207,148,48,.3)" stroke="#CE9430" stroke-width="2"/>'+
         '<polygon points="'+(x0+pw)+','+y0+' '+(x0+pw+d)+','+(y0-d)+' '+(x0+pw+d)+','+(y0+ph-d)+' '+(x0+pw)+','+(y0+ph)+'" fill="rgba(207,148,48,.18)" stroke="#CE9430" stroke-width="2"/>'+
         '<rect x="'+x0+'" y="'+y0+'" width="'+pw+'" height="'+ph+'" fill="rgba(190,110,78,.22)" stroke="#BE6E4E" stroke-width="2.5"/>'+
         '<text x="'+(x0+pw/2)+'" y="'+(y0+ph+20)+'" text-anchor="middle" '+T+'>'+w+' '+unit+'</text>'+
         '<text x="'+(x0-8)+'" y="'+(y0+ph/2)+'" text-anchor="end" '+T+'>'+h+'</text>'+
         '<text x="'+(x0+pw+d+6)+'" y="'+(y0-d+16)+'" '+T+'>'+extra+'</text>';
  } else if(kind==='ell'){
    const a=extra;
    const uw=pw*(a.w2/a.w1), uh=ph*0.45;
    body='<polygon points="'+x0+','+y0+' '+(x0+uw)+','+y0+' '+(x0+uw)+','+(y0+uh)+' '+(x0+pw)+','+(y0+uh)+' '+(x0+pw)+','+(y0+ph)+' '+x0+','+(y0+ph)+'" fill="rgba(190,110,78,.22)" stroke="#BE6E4E" stroke-width="2.5"/>'+
         '<line x1="'+x0+'" y1="'+(y0+uh)+'" x2="'+(x0+uw)+'" y2="'+(y0+uh)+'" stroke="#BE6E4E" stroke-width="1.5" stroke-dasharray="4 4"/>'+
         '<text x="'+(x0+pw/2)+'" y="'+(y0+ph+20)+'" text-anchor="middle" '+T+'>'+a.w1+' '+unit+'</text>'+
         '<text x="'+(x0-8)+'" y="'+(y0+ph/2)+'" text-anchor="end" '+T+'>'+a.h1+'</text>'+
         '<text x="'+(x0+uw/2)+'" y="'+(y0-8)+'" text-anchor="middle" '+T+'>'+a.w2+'</text>';
  } else {
    body='<rect x="'+x0+'" y="'+y0+'" width="'+pw+'" height="'+ph+'" rx="4" fill="rgba(190,110,78,.22)" stroke="#BE6E4E" stroke-width="2.5"/>'+
         '<text x="'+(x0+pw/2)+'" y="'+(y0+ph+20)+'" text-anchor="middle" '+T+'>'+w+' '+unit+'</text>'+
         '<text x="'+(x0-8)+'" y="'+(y0+ph/2+4)+'" text-anchor="end" '+T+'>'+h+' '+unit+'</text>';
  }
  return '<div class="shape"><svg viewBox="0 -30 '+W+' '+(H+34)+'" width="330" height="215" role="img">'+body+'</svg></div>';
}
const UNITS=['cm','in','ft','m'];
reg({
  id:'geometry', label:'Area, perimeter & volume', group:'Geometry', engine:'steps',

  levels:['Rectangles — area','Rectangles — perimeter','Triangles','Parallelograms',
          'Volume of a box','L-shapes','Mixed — every shape'],
  kindOf(p){ return p.kind; },
  levelKinds:[['area'],['perim'],['tri'],['para'],['vol'],['ell'],

  gen(level){

    answer(p){ return trimNum(geoTarget(p))+' '+p.u+(p.kind==='vol'?'³':p.kind==='perim'?'':'²'); },
    hint(p){ return {area:'Length × width.',perim:'Add all four sides.',tri:'Base × height, then halve it.',
                     para:'Base × perpendicular height.',vol:'One layer, then multiply by the depth.',
                     ell:'Whole rectangle minus the missing corner.'}[p.kind]; }
  }
});
function geoTarget(p){
  if(p.kind==='area') return p.w*p.h;
  if(p.kind==='perim') return 2*(p.w+p.h);
  if(p.kind==='tri') return p.w*p.h/2;
  if(p.kind==='para') return p.w*p.h;
  if(p.kind==='vol') return p.w*p.h*p.d;
  return p.w1*p.h1 - p.w2*p.h2;
}
function geoPrompt(p){
  const u=p.u;
  if(p.kind==='area') return 'A rectangle is '+p.w+' '+u+' long and '+p.h+' '+u+' wide. What is its area?';
  if(p.kind==='perim') return 'A rectangle is '+p.w+' '+u+' long and '+p.h+' '+u+' wide. What is its perimeter?';
  if(p.kind==='tri') return 'A triangle has base '+p.w+' '+u+' and height '+p.h+' '+u+'. What is its area?';
  if(p.kind==='para') return 'A parallelogram has base '+p.w+' '+u+' and height '+p.h+' '+u+'. What is its area?';
  if(p.kind==='vol') return 'A box is '+p.w+' × '+p.h+' × '+p.d+' '+u+'. What is its volume?';
  return 'An L-shape is a '+p.w1+' × '+p.h1+' '+u+' rectangle with a '+p.w2+' × '+p.h2+' '+u+' corner removed. What is its area?';
}
function geoPic(kind,p,ans,u,msg){
  const shape = kind==='ell' ? svgShape('ell',p.w1,p.h1,u,{w1:p.w1,h1:p.h1,w2:p.w2,h2:p.h2})
              : kind==='vol' ? svgShape('prism',p.w,p.h,u,p.d+' '+u)
              : svgShape(kind==='rect'?'rect':kind, p.w, p.h, u);
  const gridW = (p.kind==='area' && p.w<=20 && p.h<=16) ? p.w : 0;
  let squares='';
  if(gridW){
    squares='<div style="display:flex;justify-content:center;margin-top:6px"><div class="fgrid" style="grid-template-columns:repeat('+p.w+',1fr);width:min(100%,'+(p.w*17)+'px)">'+
      Array(p.w*p.h).fill('<div class="ab"></div>').join('')+'</div></div>'+
      '<div class="fbarlbl" style="text-align:center">'+p.h+' rows of '+p.w+' squares = '+fmt(p.w*p.h)+' squares</div>';
  }
  return {head:{title:'What the formula is really counting', sub:msg},
    body:shape+squares+
      '<div class="note"><b>Units are half the answer.</b> A length is plain ('+u+'), an area is squared ('+u+
      '²) because you multiplied two lengths, and a volume is cubed ('+u+'³) because you multiplied three. If the units do not match the shape, something went wrong.</div>'};
}
